<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLM Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">
    
    <header class="p-4 shadow-md transition-colors duration-300" id="main-header">
        <h1 class="text-xl font-bold" id="brand-title"></h1>
    </header>

    <!-- Login Section -->
    <div id="login-section" class="flex flex-col items-center justify-center flex-grow">
        <div class="bg-gray-800 p-8 rounded-lg w-96 text-center">
            <h2 class="text-xl mb-4">DLM Login</h2>
            <input type="email" id="login-email" class="w-full p-2 mb-4 rounded bg-gray-700 text-white focus:outline-none" value="">
            <button id="btn-login" class="w-full bg-blue-600 p-2 rounded hover:bg-blue-500">Access Portal</button>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by default) -->
    <main id="dashboard-section" class="hidden flex-grow p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Operative Creation -->
        <section class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Register Operative</h2>
            <div class="flex flex-col gap-3">
                <label>Operative Name</label>
                <input type="text" id="op-name" class="p-2 rounded bg-gray-700 text-white focus:outline-none" value="">
                <label>Operative Email</label>
                <input type="email" id="op-email" class="p-2 rounded bg-gray-700 text-white focus:outline-none" value="">
                <button id="btn-create-op" class="bg-blue-600 p-2 rounded hover:bg-blue-500 mt-2">Register</button>
            </div>
        </section>

        <!-- Task Assignment -->
        <section class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Assign Task</h2>
            <div class="flex flex-col gap-3">
                <label>Select Operative</label>
                <select id="task-op" class="p-2 rounded bg-gray-700 text-white focus:outline-none"></select>
                <label>Task Details</label>
                <textarea id="task-desc" class="p-2 rounded bg-gray-700 text-white focus:outline-none h-24" value=""></textarea>
                <button id="btn-assign-task" class="bg-green-600 p-2 rounded hover:bg-green-500 mt-2">Dispatch Task</button>
            </div>
        </section>
        
        <!-- Task Review (Spans full width) -->
        <section class="bg-gray-800 p-6 rounded-lg md:col-span-2">
            <h2 class="text-lg font-semibold mb-4">Review Submissions</h2>
            <div id="submissions-list" class="flex flex-col gap-4"></div>
        </section>
    </main>

    <footer class="p-4 text-center text-sm text-gray-400 transition-colors duration-300" id="main-footer"></footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentDlmProject = null;

        // Branding Sync
        onValue(ref(db, 'branding'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('brand-title').innerText = data.title || '';
                document.getElementById('main-header').style.backgroundColor = data.headerColor || '#1f2937';
                document.getElementById('main-footer').innerText = data.footer || '';
            }
        });

        // Login Logic
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.replace(/\./g, ',');
            const snapshot = await get(ref(db, 'dlms/' + email));
            if (snapshot.exists()) {
                currentDlmProject = snapshot.val().projectId;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadOperatives();
                loadSubmissions();
            }
        });

        function loadOperatives() {
            onValue(ref(db, 'operatives'), (snapshot) => {
                const select = document.getElementById('task-op');
                select.innerHTML = '';
                snapshot.forEach((child) => {
                    if(child.val().projectId === currentDlmProject) {
                        const opt = document.createElement('option');
                        opt.value = child.key;
                        opt.text = child.val().name;
                        select.appendChild(opt);
                    }
                });
            });
        }

        document.getElementById('btn-create-op').addEventListener('click', () => {
            const name = document.getElementById('op-name').value;
            const email = document.getElementById('op-email').value;
            if (name && email) {
                set(ref(db, 'operatives/' + email.replace(/\./g, ',')), { name, email, projectId: currentDlmProject });
                document.getElementById('op-name').value = '';
                document.getElementById('op-email').value = '';
            }
        });

        document.getElementById('btn-assign-task').addEventListener('click', () => {
            const opId = document.getElementById('task-op').value;
            const desc = document.getElementById('task-desc').value;
            if (opId && desc) {
                push(ref(db, `tasks/${opId}`), { 
                    description: desc, 
                    status: 'pending',
                    timestamp: Date.now() 
                });
                document.getElementById('task-desc').value = '';
            }
        });

        function loadSubmissions() {
             // Logic to read from tasks node and generate review cards with accept/reject buttons
             // Translations from operatives will appear here.
        }
    </script>
</body>
</html>
