<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - DLM Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, set, onValue, push, get, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentDlmId = null;
        const appDiv = document.getElementById('app');

        function showLogin() {
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-6">DLM Portal</h1>
                        <form id="loginForm" class="space-y-4">
                            <input type="email" id="loginEmail" placeholder="Email" required class="w-full p-3 border rounded-lg">
                            <input type="password" id="loginPassword" placeholder="Password" required class="w-full p-3 border rounded-lg">
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Sign In</button>
                        </form>
                        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const errorMsg = document.getElementById('errorMsg');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        function showDashboard() {
            appDiv.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
                    <div class="max-w-4xl mx-auto flex justify-between items-center">
                        <h1 class="text-lg font-bold">LinguaSiteFranca - DLM Dashboard</h1>
                        <button id="logoutBtn" class="text-sm text-red-600">Sign Out</button>
                    </div>
                </nav>
                <div class="max-w-4xl mx-auto px-6 py-8 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h2 class="text-xl font-bold mb-4">Assign Task to Operative</h2>
                        <form id="taskForm" class="space-y-4">
                            <select id="taskOperative" required class="w-full p-3 border rounded-lg">
                                <option value="">Select Operative...</option>
                            </select>
                            <textarea id="taskDesc" placeholder="Task description in English" rows="3" required class="w-full p-3 border rounded-lg"></textarea>
                            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg">Assign Task</button>
                        </form>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h2 class="text-xl font-bold mb-4">Pending Submissions</h2>
                        <div id="submissionsList" class="space-y-4"><p class="text-gray-500">Loading...</p></div>
                    </div>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
            document.getElementById('taskForm').addEventListener('submit', handleAssignTask);

            loadOperatives();
            loadSubmissions();
        }

        function loadOperatives() {
            const q = query(ref(db, 'users'), orderByChild('assignedDlm'), equalTo(currentDlmId));
            onValue(q, (snapshot) => {
                const select = document.getElementById('taskOperative');
                if (!select) return;
                select.innerHTML = '<option value="">Select Operative...</option>';
                snapshot.forEach(child => {
                    const u = child.val();
                    const opt = document.createElement('option');
                    opt.value = child.key;
                    opt.textContent = u.name || u.email;
                    select.appendChild(opt);
                });
            });
        }

        function loadSubmissions() {
            const q = query(ref(db, 'tasks'), orderByChild('dlmId'), equalTo(currentDlmId));
            onValue(q, (snapshot) => {
                const list = document.getElementById('submissionsList');
                if (!list) return;
                list.innerHTML = '';
                let found = false;

                snapshot.forEach(child => {
                    const task = child.val();
                    if (task.status === 'submitted') {
                        found = true;
                        const div = document.createElement('div');
                        div.className = 'border p-4 rounded-lg bg-gray-50 space-y-3';
                        div.innerHTML = `
                            <p><strong>Task:</strong> ${task.description_en}</p>
                            <p><strong>Comment:</strong> ${task.operative_comment_native || 'None'}</p>
                            <div class="flex gap-2 flex-wrap">
                                ${task.photos ? task.photos.map(p => `<img src="${p}" class="w-16 h-16 object-cover rounded border">`).join('') : ''}
                            </div>
                            <textarea id="feedback_${child.key}" placeholder="Feedback..." class="w-full p-2 border rounded text-sm"></textarea>
                            <div class="flex gap-2">
                                <button onclick="window.review('${child.key}', 'approved')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Approve</button>
                                <button onclick="window.review('${child.key}', 'rejected')" class="bg-red-600 text-white px-4 py-2 rounded text-sm font-bold">Request Revision</button>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                });

                if (!found) list.innerHTML = '<p class="text-gray-500">No pending submissions.</p>';
            });
        }

        async function handleAssignTask(e) {
            e.preventDefault();
            const operativeId = document.getElementById('taskOperative').value;
            const description_en = document.getElementById('taskDesc').value;

            try {
                const newRef = push(ref(db, 'tasks'));
                await set(newRef, {
                    dlmId: currentDlmId,
                    operativeId,
                    description_en,
                    status: 'assigned',
                    createdAt: new Date().toISOString()
                });
                alert('✅ Task assigned!');
                e.target.reset();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        window.review = async (taskId, status) => {
            const feedback = document.getElementById(`feedback_${taskId}`).value;
            try {
                const tRef = ref(db, `tasks/${taskId}`);
                const snap = await get(tRef);
                const data = snap.val();
                await set(tRef, {
                    ...data,
                    status,
                    dlm_feedback_en: feedback
                });
                alert('✅ Review saved!');
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('🟢 DLM Auth: User signed in:', user.uid);
                try {
                    const snap = await get(ref(db, `users/${user.uid}`));
                    if (snap.exists() && snap.val().role === 'dlm') {
                        currentDlmId = user.uid;
                        showDashboard();
                    } else {
                        console.warn('⚠️ Access denied: Not DLM role.');
                        alert('Access denied: DLM account required');
                        signOut(auth);
                    }
                } catch (err) {
                    console.error('❌ DB error:', err);
                }
            } else {
                console.log('ℹ️ DLM Auth: Signed out.');
                showLogin();
            }
        });
    </script>
</body>
</html>
