<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLM Management Portal - LinguaSiteFranca</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --accent: #3b82f6; --accent-hover: #2563eb;
      --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { width: 96%; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; min-height: 95vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
    h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--accent); color: white; width: 100%; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: rgba(0,0,0,0.2); color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-assigned { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-submitted { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-accepted { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-returned { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); }
    .dynamic-footer { margin-top: auto; padding-top: 20px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    .modal { display: none; position: fixed; z-index: 1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
    .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; border: 2px solid var(--border); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="brand-name">LinguaSiteFranca</span> — DLM Portal</h1>
    <div><label style="display:inline; margin-right:10px;">Select DLM Manager:</label><select id="dlmUserSelect" style="width:200px; display:inline-block;"></select></div>
  </header>

  <div class="grid-2">
    <div class="card">
      <div class="card-title">Register Operative & Qualifications</div>
      <form id="createOpForm">
        <div class="form-group"><label>Operative Full Name</label><input type="text" id="opName" required></div>
        <div class="form-group"><label>Assigned Site</label><select id="opSiteSelect" required></select></div>
        <div class="form-group"><label>Employer / Company</label><input type="text" id="opEmployer" required placeholder="e.g. Acme Subcontractors Ltd"></div>
        <div class="form-group"><label>Qualification / Card (e.g., CSCS, CPCS)</label><input type="text" id="opQual" required></div>
        <div class="form-group"><label>Expiry Date</label><input type="date" id="opExpiry" required></div>
        <button type="submit">Register Operative</button>
      </form>
    </div>

    <div class="card">
      <div class="card-title">Assign New Task to Operative</div>
      <form id="createTaskForm">
        <div class="form-group"><label>Target Site</label><select id="taskSiteSelect" required></select></div>
        <div class="form-group"><label>Assign to Operative</label><select id="taskOpSelect" required></select></div>
        <div class="form-group"><label>Task Details & Instructions</label><textarea id="taskDetails" rows="3" required></textarea></div>
        <button type="submit">Dispatch Task</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Task Review & Sign-Off Management</div>
    <div style="overflow-x: auto;">
      <table>
        <thead><tr><th>Site</th><th>Operative</th><th>Task Details</th><th>Status</th><th>Photo</th><th>Operative Comment</th><th>Actions</th></tr></thead>
        <tbody id="dlmTasksBody"></tbody>
      </table>
    </div>
  </div>

  <div class="dynamic-footer"></div>
</div>

<div class="modal" id="imgModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, set, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
    authDomain: "lingua-site-franca.firebaseapp.com",
    databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lingua-site-franca",
    storageBucket: "lingua-site-franca.firebasestorage.app",
    messagingSenderId: "737514168886",
    appId: "1:737514168886:web:08f3abd5816505d3a72e97"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  async function translateToEnglish(text) {
    if (!text) return '';
    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
      const data = await res.json();
      return data[0][0][0];
    } catch (e) { return text; }
  }

  onValue(ref(db, 'branding'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (data.businessName) document.querySelectorAll('.brand-name').forEach(el => el.innerText = data.businessName);
      if (data.footerText) document.querySelectorAll('.dynamic-footer').forEach(el => el.innerText = data.footerText);
    }
  });

  onValue(ref(db, 'dlms'), (snapshot) => {
    const data = snapshot.val() || {};
    const select = document.getElementById('dlmUserSelect');
    select.innerHTML = '';
    Object.keys(data).forEach(key => {
      const d = data[key];
      select.innerHTML += `<option value="${d.name}">${d.name} (${d.site})</option>`;
    });
  });

  onValue(ref(db, 'sites'), (snapshot) => {
    const data = snapshot.val() || {};
    const opSite = document.getElementById('opSiteSelect');
    const taskSite = document.getElementById('taskSiteSelect');
    opSite.innerHTML = ''; taskSite.innerHTML = '';
    Object.keys(data).forEach(key => {
      const s = data[key];
      opSite.innerHTML += `<option value="${s.name}">${s.name}</option>`;
      taskSite.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    });
  });

  onValue(ref(db, 'operatives'), (snapshot) => {
    const data = snapshot.val() || {};
    const select = document.getElementById('taskOpSelect');
    select.innerHTML = '';
    Object.keys(data).forEach(key => {
      const op = data[key];
      select.innerHTML += `<option value="${op.name}">${op.name} (${op.employer || 'Direct'}) — ${op.assignedSite}</option>`;
    });
  });

  onValue(ref(db, 'tasks'), async (snapshot) => {
    const data = snapshot.val() || {};
    const tbody = document.getElementById('dlmTasksBody');
    tbody.innerHTML = '';
    for (const key of Object.keys(data)) {
      const t = data[key];
      const photoHtml = t.photo ? `<img src="${t.photo}" class="thumb-img" onclick="openModal('${t.photo}')">` : '—';
      let commentHtml = '—';
      const rawComment = t.comment || t.returnNote;
      if (rawComment) {
        const translated = await translateToEnglish(rawComment);
        commentHtml = `<p style="font-size:0.8rem; color:#cbd5e1;">Orig: "${rawComment}"</p><p style="font-size:0.85rem; color:#38bdf8;">En: "${translated}"</p>`;
      }
      let actionHtml = '';
      if (t.status === 'Submitted') {
        actionHtml = `<button style="background:var(--success); padding:6px; font-size:0.8rem; margin-bottom:4px;" onclick="updateTaskStatus('${key}', 'Accepted')">Accept</button>
                      <button style="background:var(--danger); padding:6px; font-size:0.8rem;" onclick="returnTaskPrompt('${key}')">Return</button>`;
      } else {
        actionHtml = `<span style="font-size:0.85rem; color:var(--text-muted);">No action needed</span>`;
      }
      tbody.innerHTML += `<tr><td>${t.site}</td><td><strong>${t.operative}</strong></td><td>${t.details}</td><td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td><td>${photoHtml}</td><td>${commentHtml}</td><td>${actionHtml}</td></tr>`;
    }
  });

  document.getElementById('createOpForm').addEventListener('submit', (e) => {
    e.preventDefault();
    push(ref(db, 'operatives'), {
      name: document.getElementById('opName').value.trim(),
      assignedSite: document.getElementById('opSiteSelect').value,
      employer: document.getElementById('opEmployer').value.trim(),
      qualification: document.getElementById('opQual').value.trim(),
      expiry: document.getElementById('opExpiry').value
    }).then(() => { alert("Operative registered successfully!"); e.target.reset(); });
  });

  document.getElementById('createTaskForm').addEventListener('submit', (e) => {
    e.preventDefault();
    push(ref(db, 'tasks'), {
      site: document.getElementById('taskSiteSelect').value,
      operative: document.getElementById('taskOpSelect').value,
      details: document.getElementById('taskDetails').value.trim(),
      status: 'Assigned',
      timestamp: Date.now()
    }).then(() => { alert("Task dispatched successfully!"); e.target.reset(); });
  });

  window.updateTaskStatus = (key, status) => {
    update(ref(db, `tasks/${key}`), { status }).then(() => alert(`Task status updated to ${status}`));
  };

  window.returnTaskPrompt = (key) => {
    const note = prompt("Enter return / correction instructions for operative:");
    if (note) {
      update(ref(db, `tasks/${key}`), { status: 'Returned', returnNote: note });
    }
  };

  window.openModal = (src) => { document.getElementById('modalImg').src = src; document.getElementById('imgModal').style.display = 'flex'; };
</script>
</body>
</html>
