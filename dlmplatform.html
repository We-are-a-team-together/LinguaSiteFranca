<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Line Manager Platform</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        html, body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: none; flex-direction: column; min-height: 95vh; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .header-logo { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; display: none; }
        .header-title { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 700; color: #fff; }
        .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .dlm-badge { background: var(--card-bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; margin-bottom: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: clamp(15px, 2vw, 22px); margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; transition: background-color 0.2s; text-align: center; }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-outline:hover { background-color: rgba(59, 130, 246, 0.1); }
        .btn-auto { min-width: auto; }
        .btn-full { width: 100%; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: #0da271; }
        .btn-warning { background-color: var(--warning); color: white; }
        .btn-warning:hover { background-color: #d97706; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
        .form-control:focus { outline: none; border-color: var(--accent); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: var(--text); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-button { background: transparent; border: none; color: var(--text-muted); padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .task-item, .report-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .task-title, .report-title { font-weight: 600; margin-bottom: 5px; }
        .task-meta, .report-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .task-actions, .report-actions { display: flex; gap: 8px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-open { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .badge-submitted { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-valid { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .task-desc, .report-desc { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 6px; border-left: 4px solid var(--accent); margin-top: 8px; }
        .thumb-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
        .history-box { margin-top: 15px; background: rgba(0,0,0,0.15); border-radius: 6px; padding: 10px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .history-table th, .history-table td { padding: 6px 8px; border: 1px solid var(--border); font-size: 0.8rem; }
        .history-table th { background: rgba(0,0,0,0.3); }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 30px; max-width: 400px; width: 90%; text-align: center; }
        .login-card h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .login-form { display: flex; flex-direction: column; gap: 15px; }
        .form-group-inline { display: flex; gap: 10px; }
        .form-group-inline .form-control { flex: 1; }
        .loading-spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid var(--accent); width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        .dynamic-footer { text-align: center; margin-top: auto; padding-top: 20px; color: var(--text-muted); font-size: 0.8rem; }
        h1 { font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700; color: #fff; }
        .return-note-desc { margin-top: 10px; padding: 10px; background: rgba(239, 68, 68, 0.15); border-left: 4px solid var(--danger); border-radius: 0 6px 6px 0; }
        .completed-banner { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px; font-weight: 600; }
        .locked-banner { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px; font-weight: 600; }
        .dlm-ref-photo { margin-top: 10px; }
        .dlm-ref-photo small { display: block; color: var(--text-muted); margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <img id="loginLogo" class="header-logo" src="" alt="Logo" style="display: none;">
            <h2 id="loginTitle"><span class="brand-name">Platform</span> — DLM Login</h2>
            <form id="dlmLoginForm" class="login-form">
                <div class="form-group">
                    <label for="dlmLoginName">Your Name</label>
                    <input type="text" id="dlmLoginName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="dlmLoginPassword">Password</label>
                    <input type="password" id="dlmLoginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Access Platform</button>
            </form>
            <p id="loginError" style="color: var(--danger); margin-top: 12px; font-size: 0.85rem; display: none;"></p>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <header>
            <div class="header-left">
                <img id="headerLogo" class="header-logo" src="" alt="Logo">
                <h1><span class="brand-name">Platform</span> — Direct Line Manager</h1>
                <button id="navToggleBtn" class="btn btn-outline btn-auto">Open Reports View</button>
            </div>
            <div class="dlm-badge" id="dlmBadgeInfo">Loading...</div>
        </header>

        <!-- DASHBOARD -->
        <div class="tabs">
            <button class="tab-button active" data-tab="dashboardTab">Dashboard</button>
            <button class="tab-button" data-tab="tasksTab">My Tasks</button>
            <button class="tab-button" data-tab="reportsTab">My Reports</button>
            <button class="tab-button" data-tab="createTaskTab">Assign Task</button>
        </div>

        <div id="dashboardTab" class="tab-content active">
            <div class="grid-2">
                <div class="card">
                    <h3>Quick Stats</h3>
                    <p>Total Tasks: <span id="statTotalTasks">0</span></p>
                    <p>Submitted: <span id="statSubmittedTasks">0</span></p>
                    <p>Accepted/Approved: <span id="statAcceptedTasks">0</span></p>
                    <p>Returned: <span id="statReturnedTasks">0</span></p>
                </div>
                <div class="card">
                    <h3>Recent Activity</h3>
                    <div id="recentActivityList"></div>
                </div>
            </div>
        </div>

        <div id="tasksTab" class="tab-content">
            <div id="taskItemsContainer"></div>
        </div>

        <div id="reportsTab" class="tab-content">
            <div id="reportItemsContainer"></div>
        </div>

        <div id="createTaskTab" class="tab-content">
            <div class="card">
                <h3>Assign New Task</h3>
                <form id="assignTaskForm" class="login-form">
                    <div class="form-group">
                        <label for="assignOperative">Select Team Member</label>
                        <select id="assignOperative" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label for="taskDetails">Task Details</label>
                        <textarea id="taskDetails" class="form-control" rows="3" placeholder="Describe the task..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="taskPhoto">Reference Photo (Optional)</label>
                        <input type="file" id="taskPhoto" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Dispatch Task</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Task View Modal -->
    <div id="taskViewModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title" id="viewTaskTitle">Task Details</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div id="viewTaskDetails"></div>
            <div id="taskHistoryBox" class="history-box" style="display:none;"></div>
            <div id="taskActionArea" style="display:none; margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-success btn-auto" id="btnAcceptTask">Accept (Complete)</button>
                <button class="btn btn-warning btn-auto" id="btnReturnTask">Return for Revision</button>
            </div>
            <div id="taskReturnForm" style="display:none; margin-top: 15px;">
                <div class="form-group">
                    <label for="taskReturnNote">Reason for Return</label>
                    <textarea id="taskReturnNote" class="form-control" rows="3" placeholder="Explain why the task is being returned..."></textarea>
                </div>
                <button id="btnConfirmReturn" class="btn btn-warning btn-full">Confirm Return</button>
                <button id="btnCancelReturn" class="btn btn-outline btn-full">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Report View Modal -->
    <div id="reportViewModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 class="modal-title" id="viewReportTitle">Report Details</h3>
                <button class="close-btn">&times;</button>
            </div>
            <p><strong>Reference:</strong> <span id="viewReportRef"></span></p>
            <div id="viewReportDetails"></div>
            <div id="reportHistoryBox" class="history-box" style="display:none;"></div>
            <div id="reportActionArea" style="display:none; margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-success btn-auto" id="btnAcceptReport">Accept (Complete)</button>
                <button class="btn btn-warning btn-auto" id="btnReturnReport">Return for Revision</button>
            </div>
            <div id="reportReturnForm" style="display:none; margin-top: 15px;">
                <div class="form-group">
                    <label for="reportReturnNote">Reason for Return</label>
                    <textarea id="reportReturnNote" class="form-control" rows="3" placeholder="Explain why the report is being returned..."></textarea>
                </div>
                <button id="btnConfirmReportReturn" class="btn btn-warning btn-full">Confirm Return</button>
                <button id="btnCancelReportReturn" class="btn btn-outline btn-full">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imgModal" class="modal">
        <div class="modal-content" style="max-width: 90vw; max-height: 90vh; display: flex; justify-content: center; align-items: center;">
            <img id="modalImg" src="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            <button class="close-btn" style="position: absolute; top: 15px; right: 15px;">&times;</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove, update, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            // --- PASTE YOUR FIREBASE CONFIG HERE ---
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentDlm = "";
        let currentDlmKey = "";
        let currentSite = "";
        let allTasksData = {};
        let allReportsData = {};
        let allOperatives = {};
        let currentActiveReportKey = null;
        let currentTaskKey = null;

        // Fetch branding once
        onValue(ref(db, 'branding'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.businessName) {
                document.querySelectorAll('.brand-name').forEach(el => el.innerText = data.businessName);
                document.title = `${data.businessName} - Direct Line Manager Platform`;
                document.getElementById('loginTitle').innerText = `${data.businessName} — DLM Login`;
            }
            if (data.footerText) document.querySelectorAll('.dynamic-footer').forEach(el => el.innerText = data.footerText);
            if (data.logo) {
                document.getElementById('loginLogo').src = data.logo;
                document.getElementById('loginLogo').style.display = 'block';
                document.getElementById('headerLogo').src = data.logo;
                document.getElementById('headerLogo').style.display = 'block';
            }
            if (data.primaryColor) document.documentElement.style.setProperty('--accent', data.primaryColor);
            if (data.secondaryColor) document.documentElement.style.setProperty('--success', data.secondaryColor);
        });

        // ====== LOGIN ======
        document.getElementById('dlmLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('dlmLoginName').value.trim();
            const pwd = document.getElementById('dlmLoginPassword').value;
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';

            if (!name || !pwd) {
                errEl.innerText = 'Please enter both name and password.';
                errEl.style.display = 'block';
                return;
            }

            let match = null;
            let matchKey = null;
            onValue(ref(db, 'dlmAccounts'), (snapshot) => {
                const accounts = snapshot.val();
                if (accounts) {
                    for (const key in accounts) {
                        const acc = accounts[key];
                        if (acc.name === name && acc.password === pwd) {
                            match = acc;
                            matchKey = key;
                            break;
                        }
                    }
                }
            }, { onlyOnce: true });

            if (!match) {
                errEl.innerText = 'Invalid credentials.';
                errEl.style.display = 'block';
                return;
            }

            currentDlm = name;
            currentDlmKey = matchKey;
            currentSite = match.assignedSite || 'Unassigned';

            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'flex';
            document.getElementById('dlmBadgeInfo').innerText = `DLM: ${currentDlm} | Location: ${currentSite}`;

            // Check if account exists continuously after login
            onValue(ref(db, `dlmAccounts/${currentDlmKey}`), (s) => {
                if (!s.exists()) {
                    alert('Your account has been removed by the Office. You will be logged out.');
                    window.location.reload();
                }
            });

            loadDashboard();
        });

        // ====== TRANSLATE ======
        async function translateToEnglish(text) {
            if (!text) return 'None';
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
                const data = await response.json();
                return data[0]?.[0]?.[0] || text;
            } catch (error) {
                console.warn("Translation failed, returning original text:", text);
                return text;
            }
        }

        // ====== TAB NAVIGATION ======
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabId = button.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                button.classList.add('active');
            });
        });

        // Toggle between Tasks and Reports tabs using the header button
        document.getElementById('navToggleBtn').addEventListener('click', () => {
            const tasksTab = document.getElementById('tasksTab');
            const reportsTab = document.getElementById('reportsTab');
            const tasksButton = document.querySelector('[data-tab="tasksTab"]');
            const reportsButton = document.querySelector('[data-tab="reportsTab"]');

            if (tasksTab.classList.contains('active')) {
                reportsTab.classList.add('active');
                tasksTab.classList.remove('active');
                reportsButton.classList.add('active');
                tasksButton.classList.remove('active');
                document.getElementById('navToggleBtn').textContent = 'Open Tasks View';
            } else {
                tasksTab.classList.add('active');
                reportsTab.classList.remove('active');
                tasksButton.classList.add('active');
                reportsButton.classList.remove('active');
                document.getElementById('navToggleBtn').textContent = 'Open Reports View';
            }
        });

        // ====== DATA LOADING WITH SERVER-SIDE FILTERING ======

        // Load operatives for assignment dropdown
        onValue(ref(db, 'operatives'), (snapshot) => {
            allOperatives = snapshot.val() || {};
            populateOperativeDropdown();
        });

        function populateOperativeDropdown() {
            const select = document.getElementById('assignOperative');
            select.innerHTML = '';
            for (const key in allOperatives) {
                const op = allOperatives[key];
                if (op.assignedSite === currentSite) { // Filter by site
                    const option = document.createElement('option');
                    option.value = op.name;
                    option.textContent = op.name;
                    select.appendChild(option);
                }
            }
        }

        // Load Tasks assigned to the current DLM's site
        // 1. SERVER-SIDE FILTERING FOR TASKS (The "Bill = £0.00" magic)
        // This tells Firebase: "Only send tasks where 'site' exactly matches currentSite"
        const tasksQuery = query(ref(db, 'tasks'), orderByChild('site'), equalTo(currentSite));
        onValue(tasksQuery, (snapshot) => {
            allTasksData = snapshot.val() || {};
            renderTasksList();
            updateDashboardStats();
        });

        // Load Reports assigned to the current DLM's site
        // 2. SERVER-SIDE FILTERING FOR REPORTS (The "Bill = £0.00" magic)
        // This tells Firebase: "Only send reports where 'assignedTo' contains currentSite OR 'site' matches currentSite"
        // Note: This assumes 'assignedTo' is structured as an array or object containing site names.
        // Adjust the query if the structure is different (e.g., a single string field).
        // For simplicity, assuming 'reports' have a 'site' field like tasks do.
        const reportsQuery = query(ref(db, 'reports'), orderByChild('site'), equalTo(currentSite));
        onValue(reportsQuery, (snapshot) => {
            allReportsData = snapshot.val() || {};
            renderReportsList();
            updateDashboardStats();
        });

        // ====== RENDER TASKS ======
        async function renderTasksList() {
            const container = document.getElementById('taskItemsContainer');
            container.innerHTML = '';
            const sortedKeys = Object.keys(allTasksData).sort((a, b) => new Date(allTasksData[b].createdAt) - new Date(allTasksData[a].createdAt));

            for (const key of sortedKeys) {
                const task = allTasksData[key];
                const refNum = task.refNumber || key.substring(0, 8);
                let badgeClass = 'badge-open';
                if (task.status === 'Accepted' || task.status === 'Approved') badgeClass = 'badge-valid';
                else if (task.status === 'Returned') badgeClass = 'badge-expired';
                else if (task.status === 'Submitted') badgeClass = 'badge-submitted';

                const translatedComment = await translateToEnglish(task.comment || '');
                const opPhoto = task.operativePhoto || task.photo;
                const opPhotoHtml = opPhoto ? `<img src="${opPhoto}" class="thumb-img" onclick="openImageModal('${opPhoto}')">` : 'No photo';

                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                taskElement.innerHTML = `
                    <div class="task-title">${refNum}: ${task.details || 'N/A'}</div>
                    <div class="task-meta">Status: <span class="badge ${badgeClass}">${task.status || 'Assigned'}</span> | Operative: ${task.operative || 'N/A'}</div>
                    <div class="task-meta">Created: ${task.createdAt ? new Date(task.createdAt).toLocaleString() : 'N/A'}</div>
                    <div class="task-meta">Comment: ${translatedComment}</div>
                    <div class="task-meta">Photo: ${opPhotoHtml}</div>
                    <div class="task-actions">
                        <button class="btn btn-outline btn-auto" onclick="openTaskView('${key}')">View Details</button>
                    </div>
                `;
                container.appendChild(taskElement);
            }
        }

        // ====== RENDER REPORTS ======
        async function renderReportsList() {
            const container = document.getElementById('reportItemsContainer');
            container.innerHTML = '';
            const sortedKeys = Object.keys(allReportsData).sort((a, b) => new Date(allReportsData[b].createdAt) - new Date(allReportsData[a].createdAt));

            for (const key of sortedKeys) {
                const report = allReportsData[key];
                const refNum = report.refNumber || key.substring(0, 8);
                let badgeClass = 'badge-open';
                if (report.status === 'Accepted' || report.status === 'Approved') badgeClass = 'badge-valid';
                else if (report.status === 'Returned') badgeClass = 'badge-expired';
                else if (report.status === 'Submitted') badgeClass = 'badge-submitted';

                const reportElement = document.createElement('div');
                reportElement.className = 'report-item';
                reportElement.innerHTML = `
                    <div class="report-title">${refNum}: ${report.title || 'N/A'}</div>
                    <div class="report-meta">Status: <span class="badge ${badgeClass}">${report.status || 'Assigned'}</span></div>
                    <div class="report-meta">Created: ${report.createdAt ? new Date(report.createdAt).toLocaleString() : 'N/A'}</div>
                    <div class="report-actions">
                        <button class="btn btn-outline btn-auto" onclick="openReportView('${key}')">View Details</button>
                    </div>
                `;
                container.appendChild(reportElement);
            }
        }

        // ====== DASHBOARD STATS ======
        function updateDashboardStats() {
            let totalTasks = 0, submittedTasks = 0, acceptedTasks = 0, returnedTasks = 0;

            for (const key in allTasksData) {
                totalTasks++;
                const status = allTasksData[key].status;
                if (status === 'Submitted') submittedTasks++;
                if (status === 'Accepted' || status === 'Approved') acceptedTasks++;
                if (status === 'Returned') returnedTasks++;
            }

            document.getElementById('statTotalTasks').textContent = totalTasks;
            document.getElementById('statSubmittedTasks').textContent = submittedTasks;
            document.getElementById('statAcceptedTasks').textContent = acceptedTasks;
            document.getElementById('statReturnedTasks').textContent = returnedTasks;
        }

        function loadDashboard() {
            // Stats are updated automatically by updateDashboardStats() when data changes
            // Recent activity could be implemented similarly if needed, filtered by site
        }

        // ====== MODAL VIEW FUNCTIONS ======
        window.openImageModal = (src) => {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').style.display = 'flex';
        };

        window.openTaskView = async (key) => {
            const task = allTasksData[key]; // Use local cache
            if (!task) return alert('Task not found.');
            currentTaskKey = key;

            document.getElementById('viewTaskTitle').innerText = `Task: ${task.details || key.substring(0, 8)}`;
            const translatedComment = await translateToEnglish(task.comment || '');
            const opPhoto = task.operativePhoto || task.photo;
            const opPhotoTag = opPhoto ? `<img src="${opPhoto}" style="max-width:200px; border-radius:6px; border:1px solid #cbd5e1;" onclick="openImageModal('${opPhoto}')" />` : '<em>No photo</em>';
            const dlmPhotoTag = task.dlmPhoto ? `<img src="${task.dlmPhoto}" style="max-width:200px; border-radius:6px; border:1px solid #cbd5e1;" onclick="openImageModal('${task.dlmPhoto}')" />` : '<em>No reference photo</em>';

            const history = task.history || [];
            const historyRows = history.map(h => `<tr><td>${new Date(h.timestamp).toLocaleString()}</td><td>${h.action}</td><td>${h.note || ''}</td></tr>`).join('');

            let actionAreaStyle = 'none';
            let historyBoxStyle = 'none';
            let historyBoxContent = '';

            if (task.status === 'Submitted') {
                 actionAreaStyle = 'flex';
            }

             if (history.length > 0) {
                historyBoxStyle = 'block';
                historyBoxContent = `<table class="history-table"><thead><tr><th>Date/Time</th><th>Action</th><th>Note</th></tr></thead><tbody>${historyRows}</tbody></table>`;
            }

            document.getElementById('taskActionArea').style.display = actionAreaStyle;
            document.getElementById('taskReturnNote').value = '';
            const historyBox = document.getElementById('taskHistoryBox');
            historyBox.style.display = historyBoxStyle;
            historyBox.innerHTML = historyBoxContent;

            document.getElementById('viewTaskDetails').innerHTML = `
                <div class="card" style="margin-bottom:10px;">
                    <strong>DLM Description:</strong>
                    <div style="margin-top:8px; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 6px; border-left: 4px solid var(--accent);">${task.details || 'N/A'}</div>
                    <div style="margin-top:8px;"><small style="color:var(--text-muted);">Reference photo:</small><br>${dlmPhotoTag}</div>
                    <div style="margin-top:8px;"><small style="color:var(--text-muted);">Created:</small> ${task.createdAt ? new Date(task.createdAt).toLocaleString() : 'N/A'}</div>
                </div>
                <div class="card">
                    <strong>Team Member's Response:</strong>
                    <div style="margin-top:8px;"><small style="color:var(--text-muted);">Comment (translated to English):</small><div style="margin-top:4px; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 6px; border-left: 4px solid var(--success);">${translatedComment}</div></div>
                    <div style="margin-top:8px;"><small style="color:var(--text-muted);">Photo evidence:</small><br>${opPhotoTag}</div>
                    <div style="margin-top:8px;"><small style="color:var(--text-muted);">Submitted:</small> ${task.submittedAt ? new Date(task.submittedAt).toLocaleString() : 'N/A'}</div>
                </div>
            `;

            document.getElementById('taskViewModal').style.display = 'flex';
        };

        window.openReportView = async (key) => {
            const report = allReportsData[key]; // Use local cache
            if (!report) return alert('Report not found.');
            currentActiveReportKey = key;

            document.getElementById('viewReportTitle').innerText = report.title;
            document.getElementById('viewReportRef').innerText = report.refNumber || key.substring(0, 8);

            const assignedNames = Array.isArray(report.assignedTo) ? report.assignedTo.join(', ') : (typeof report.assignedTo === 'object' ? Object.values(report.assignedTo).join(', ') : report.assignedTo);

            let itemsHtml = '';
            if (report.items) {
                const itemsArr = Array.isArray(report.items) ? report.items : Object.values(report.items);
                for (let i = 0; i < itemsArr.length; i++) {
                    const item = itemsArr[i];
                    const dlmPhotoTag = item.photo ? `<img src="${item.photo}" style="max-width:150px; border-radius:6px; border:1px solid #cbd5e1;" onclick="openImageModal('${item.photo}')" />` : '<em>No photo</em>';
                    const opPhoto = item.submittedPhoto || item.operativePhoto;
                    const opPhotoTag = opPhoto ? `<img src="${opPhoto}" style="max-width:150px; border-radius:6px; border:1px solid #cbd5e1;" onclick="openImageModal('${opPhoto}')" />` : '<em>No photo</em>';
                    const translatedComment = await translateToEnglish(item.comment || '');

                    const itemHistory = item.history || [];
                    const itemHistoryHtml = itemHistory.map(h => `<tr><td>${new Date(h.timestamp).toLocaleString()}</td><td>${h.action}</td><td>${h.note || ''}</td></tr>`).join('');

                    itemsHtml += `<tr><td><strong>Item ${i+1}</strong><br><small>Status: ${item.status || 'Assigned'}</small></td><td><strong>DLM Description:</strong> ${item.description}<br><br><strong>Photo provided by DLM:</strong><br>${dlmPhotoTag}<br><br><strong>Operative comment (translated to English):</strong><br>${translatedComment}<br><br><strong>Photo provided by operative:</strong><br>${opPhotoTag}<br><br><table class="history-table"><thead><tr><th>Date/Time</th><th>Action</th><th>Note</th></tr></thead><tbody>${itemHistoryHtml}</tbody></table></td></tr>`;
                }
            } else {
                 itemsHtml = `<tr><td colspan="2">No items found in this report.</td></tr>`;
            }

            const reportHistory = report.history || [];
            const reportHistoryRows = reportHistory.map(h => `<tr><td>${new Date(h.timestamp).toLocaleString()}</td><td>${h.action}</td><td>${h.note || ''}</td></tr>`).join('');

            let actionAreaStyle = 'none';
            let historyBoxStyle = 'none';
            let historyBoxContent = '';

            if (report.status === 'Submitted') {
                 actionAreaStyle = 'flex';
            }

             if (reportHistory.length > 0) {
                historyBoxStyle = 'block';
                historyBoxContent = `<table class="history-table"><thead><tr><th>Date/Time</th><th>Action</th><th>Note</th></tr></thead><tbody>${reportHistoryRows}</tbody></table>`;
            }

            document.getElementById('reportActionArea').style.display = actionAreaStyle;
            document.getElementById('reportReturnNote').value = '';
            const historyBox = document.getElementById('reportHistoryBox');
            historyBox.style.display = historyBoxStyle;
            historyBox.innerHTML = historyBoxContent;

            document.getElementById('viewReportDetails').innerHTML = `
                <div class="card">
                    <p><strong>Reference Number:</strong> ${report.refNumber || key.substring(0, 8)}</p>
                    <p><strong>Assigned To:</strong> ${assignedNames || 'N/A'}</p>
                    <p><strong>Created:</strong> ${report.createdAt ? new Date(report.createdAt).toLocaleString() : 'N/A'}</p>
                    <p><strong>Submitted:</strong> ${report.submittedAt ? new Date(report.submittedAt).toLocaleString() : 'N/A'}</p>
                </div>
                <table style="width:100%; border-collapse: collapse; margin-top: 10px;">
                    <thead>
                        <tr><th style="width: 30%;">Item Info</th><th style="width: 70%;">Details & History</th></tr>
                    </thead>
                    <tbody>${itemsHtml}</tbody>
                </table>
            `;

            document.getElementById('reportViewModal').style.display = 'flex';
        };

        // Close modals
        document.querySelectorAll('.close-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.modal').forEach(modal => modal.style.display = 'none');
            });
        });
        window.onclick = (event) => {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };

        // ====== TASK ACTIONS (Accept/Return) ======
        document.getElementById('btnAcceptTask').addEventListener('click', async () => {
            if (!currentTaskKey) return;
            const task = allTasksData[currentTaskKey]; // Use local cache
            if (!task) return;
            const history = task.history || [];
            history.push({ action: 'Accepted by DLM', timestamp: new Date().toISOString() });
            await update(ref(db, `tasks/${currentTaskKey}`), { status: 'Accepted', history });
            document.getElementById('taskViewModal').style.display = 'none';
        });

        document.getElementById('btnReturnTask').addEventListener('click', () => {
            document.getElementById('taskActionArea').style.display = 'none';
            document.getElementById('taskReturnForm').style.display = 'block';
        });

        document.getElementById('btnCancelReturn').addEventListener('click', () => {
            document.getElementById('taskActionArea').style.display = 'flex';
            document.getElementById('taskReturnForm').style.display = 'none';
        });

        document.getElementById('btnConfirmReturn').addEventListener('click', async () => {
            const note = document.getElementById('taskReturnNote').value.trim();
            if (!note) return alert('Please provide a reason for returning.');
            const task = allTasksData[currentTaskKey]; // Use local cache
            if (!task) return;
            const history = task.history || [];
            history.push({ action: 'Returned by DLM', timestamp: new Date().toISOString(), note });
            await update(ref(db, `tasks/${currentTaskKey}`), { status: 'Returned', returnNote: note, history });
            document.getElementById('taskViewModal').style.display = 'none';
        });

        // ====== REPORT ACTIONS (Accept/Return) ======
        document.getElementById('btnAcceptReport').addEventListener('click', async () => {
            if (!currentActiveReportKey) return;
            const rep = allReportsData[currentActiveReportKey]; // Use local cache
            if (!rep) return;
            const history = rep.history || [];
            history.push({ action: 'Report accepted by DLM', timestamp: new Date().toISOString() });
            await update(ref(db, `reports/${currentActiveReportKey}`), { status: 'Accepted', history });
            document.getElementById('reportViewModal').style.display = 'none';
        });

        document.getElementById('btnReturnReport').addEventListener('click', () => {
            document.getElementById('reportActionArea').style.display = 'none';
            document.getElementById('reportReturnForm').style.display = 'block';
        });

        document.getElementById('btnCancelReportReturn').addEventListener('click', () => {
            document.getElementById('reportActionArea').style.display = 'flex';
            document.getElementById('reportReturnForm').style.display = 'none';
        });

        document.getElementById('btnConfirmReportReturn').addEventListener('click', async () => {
            const note = document.getElementById('reportReturnNote').value.trim();
            if (!note) return;
            const rep = allReportsData[currentActiveReportKey]; // Use local cache
            if (!rep) return;
            const history = rep.history || [];
            history.push({ action: 'Report returned by DLM', timestamp: new Date().toISOString(), note });
            await update(ref(db, `reports/${currentActiveReportKey}`), { status: 'Returned', returnNote: note, history });
            alert('Report returned!');
            document.getElementById('reportViewModal').style.display = 'none';
        });

        // ====== ASSIGN NEW TASK ======
        document.getElementById('assignTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const operative = document.getElementById('assignOperative').value;
            const details = document.getElementById('taskDetails').value;
            const fileInput = document.getElementById('taskPhoto');
            if (!operative || !details) return alert('Please fill in all required fields.');

            let dlmPhoto = null;
            if (fileInput.files.length > 0) {
                // Assuming compressImage function exists or use FileReader directly
                const reader = new FileReader();
                reader.onload = async (event) => {
                     dlmPhoto = event.target.result; // This might need compression
                     await createTaskAndSend(details, operative, dlmPhoto);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                 await createTaskAndSend(details, operative, null);
            }
        });

        async function createTaskAndSend(details, operative, dlmPhoto) {
             const now = new Date().toISOString();
             const refNum = 'T-' + Date.now().toString().slice(-8);
             await push(ref(db, 'tasks'), {
                 refNumber: refNum,
                 site: currentSite, // Assign the task to the current DLM's site
                 dlm: currentDlm,
                 operative: operative,
                 details: details,
                 dlmPhoto: dlmPhoto,
                 status: 'Assigned',
                 createdAt: now,
                 history: [{ action: 'Task created by DLM', timestamp: now }]
             });
             document.getElementById('assignTaskForm').reset();
             alert('Task dispatched successfully!');
        }


    </script>
    <div class="dynamic-footer">Powered by Institute of Young Scientists</div>
</body>
