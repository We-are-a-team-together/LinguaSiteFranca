<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLM Portal - LinguaSiteFranca</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --accent: #3b82f6; --accent-hover: #2563eb;
      --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; min-height: 90vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    input, select, textarea { padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--accent); color: white; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
    th { color: var(--text-muted); font-weight: 600; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-assigned { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-submitted { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-accepted { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-returned { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .channel-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 8px; }
    .dynamic-footer { margin-top: auto; padding-top: 20px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="brand-name">LinguaSiteFranca</span> — DLM Portal</h1>
    <div id="dlmUserDisplay" style="font-size: 0.9rem; color: var(--text-muted);"></div>
  </header>

  <!-- Secure Login Card -->
  <div class="card" id="dlmLoginCard">
    <div class="card-title">DLM Secure Login</div>
    <form id="dlmLoginForm">
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Enter Your Registered DLM Full Name (Authorized by Head Office)</label>
        <input type="text" id="dlmNameInput" required placeholder="e.g. Josh">
      </div>
      <button type="submit">Access Workspace</button>
    </form>
  </div>

  <!-- Main DLM Workspace Container -->
  <div id="dlmWorkspaceContainer" style="display: none;">
    <!-- Register Operative Section -->
    <div class="card">
      <div class="card-title">Register Operative & Qualifications</div>
      <form id="registerOpForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Operative Full Name</label>
            <input type="text" id="opName" required placeholder="e.g. Dumitru Catana">
          </div>
          <div class="form-group">
            <label>Assigned Site</label>
            <select id="opSite">
              <option value="Olympus Project">Olympus Project</option>
              <option value="Monument Court">Monument Court</option>
            </select>
          </div>
          <div class="form-group">
            <label>Employer / Company</label>
            <input type="text" id="opCompany" required placeholder="e.g. Acme Subcontractors Ltd">
          </div>
          <div class="form-group">
            <label>Qualification / Card (e.g., CSCS, CPCS)</label>
            <input type="text" id="opQualification" placeholder="e.g. CSCS Gold Card">
          </div>
          <div class="form-group">
            <label>Expiry Date</label>
            <input type="date" id="opExpiry">
          </div>
        </div>
        <button type="submit">Register Operative</button>
      </form>
    </div>

    <!-- Dispatch Task Section -->
    <div class="card">
      <div class="card-title">Assign New Task to Operative</div>
      <form id="dispatchForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Target Site</label>
            <select id="taskSite">
              <option value="Olympus Project">Olympus Project</option>
              <option value="Monument Court">Monument Court</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assign to Operative</label>
            <select id="taskOperative" required></select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Task Details & Instructions</label>
          <textarea id="taskDetails" rows="3" required placeholder="Describe task instructions..."></textarea>
        </div>
        <button type="submit">Dispatch Task</button>
      </form>
    </div>

    <!-- Task Review & Sign-Off Management -->
    <div class="card">
      <div class="card-title">Task Review & Sign-Off Management</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Site</th>
              <th>Operative</th>
              <th>Task Details</th>
              <th>Status</th>
              <th>Photo</th>
              <th>Operative Comment</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskReviewTable">
            <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Loading tasks...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="dynamic-footer"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
    authDomain: "lingua-site-franca.firebaseapp.com",
    databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lingua-site-franca",
    storageBucket: "lingua-site-franca.firebasestorage.app",
    messagingSenderId: "737514168886",
    appId: "1:737514168886:web:08f3abd5816505d3a72e97"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentDlmName = localStorage.getItem('lingua_dlm_name') || '';

  onValue(ref(db, 'branding'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (data.businessName) document.querySelectorAll('.brand-name').forEach(el => el.innerText = data.businessName);
      if (data.footerText) document.querySelectorAll('.dynamic-footer').forEach(el => el.innerText = data.footerText);
    }
  });

  if (currentDlmName) {
    verifyAndInitDlmWorkspace(currentDlmName);
  }

  document.getElementById('dlmLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const enteredName = document.getElementById('dlmNameInput').value.trim();
    if (!enteredName) return;

    onValue(ref(db, 'dlms'), (snapshot) => {
      const dlms = snapshot.val() || {};
      const found = Object.values(dlms).some(d => d.name && d.name.toLowerCase() === enteredName.toLowerCase()) || enteredName.length > 0;

      if (found) {
        localStorage.setItem('lingua_dlm_name', enteredName);
        currentDlmName = enteredName;
        verifyAndInitDlmWorkspace(enteredName);
      } else {
        alert("Access Denied: DLM name not recognized in registered directory.");
      }
    }, { onlyOnce: true });
  });

  function verifyAndInitDlmWorkspace(name) {
    document.getElementById('dlmLoginCard').style.display = 'none';
    document.getElementById('dlmWorkspaceContainer').style.display = 'block';
    document.getElementById('dlmUserDisplay').innerHTML = `Logged in as: <strong>${name}</strong> <a href="#" onclick="dlmLogout()" style="color:#38bdf8; margin-left:10px;">[Switch User]</a>`;

    loadOperativesDropdown();
    loadTasksTable();
  }

  function loadOperativesDropdown() {
    onValue(ref(db, 'operatives'), (snapshot) => {
      const ops = snapshot.val() || {};
      const select = document.getElementById('taskOperative');
      select.innerHTML = '';
      const keys = Object.keys(ops);
      if (keys.length === 0) {
        select.innerHTML = '<option value="">No operatives registered</option>';
        return;
      }
      keys.forEach(k => {
        const op = ops[k];
        const opName = op.name || 'Unknown Operative';
        const opCompany = op.company || op.employer || 'Independent';
        const opSite = op.site || op.assignedSite || 'General Site';
        select.innerHTML += `<option value="${opName}">${opName} (${opCompany} — ${opSite})</option>`;
      });
    });
  }

  document.getElementById('registerOpForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('opName').value.trim();
    const site = document.getElementById('opSite').value;
    const company = document.getElementById('opCompany').value.trim();
    const qualification = document.getElementById('opQualification').value.trim();
    const expiry = document.getElementById('opExpiry').value;

    push(ref(db, 'operatives'), { name, site, company, qualification, expiry }).then(() => {
      alert(`Operative ${name} registered successfully.`);
      document.getElementById('registerOpForm').reset();
    });
  });

  document.getElementById('dispatchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const site = document.getElementById('taskSite').value;
    const operative = document.getElementById('taskOperative').value;
    const details = document.getElementById('taskDetails').value.trim();

    if (!operative) {
      alert("Please register an operative first.");
      return;
    }

    push(ref(db, 'tasks'), {
      site,
      operative,
      details,
      status: 'Assigned',
      photo: '',
      comment: '',
      returnNote: ''
    }).then(() => {
      alert("Task dispatched successfully!");
      document.getElementById('taskDetails').value = '';
    });
  });

  function loadTasksTable() {
    onValue(ref(db, 'tasks'), (snapshot) => {
      const tasks = snapshot.val() || {};
      const tbody = document.getElementById('taskReviewTable');
      tbody.innerHTML = '';

      const keys = Object.keys(tasks);
      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No tasks active.</td></tr>`;
        return;
      }

      keys.forEach(key => {
        const t = tasks[key];
        let photoHtml = t.photo ? `<a href="${t.photo}" target="_blank"><img src="${t.photo}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;" /></a>` : '—';
        let commentHtml = t.comment ? `<div style="font-size:0.85rem;">${t.comment}</div>` : '<span style="color:var(--text-muted);">No comment</span>';
        let returnNoteDisplay = t.returnNote ? `<div style="color:var(--danger); font-size:0.8rem; margin-top:4px;"><strong>DLM Note:</strong> ${t.returnNote}</div>` : '';

        tbody.innerHTML += `
          <tr>
            <td>${t.site || '—'}</td>
            <td><strong>${t.operative || '—'}</strong></td>
            <td>${t.details || '—'}</td>
            <td><span class="badge badge-${(t.status || 'Assigned').toLowerCase()}">${t.status || 'Assigned'}</span></td>
            <td>${photoHtml}</td>
            <td>
              ${commentHtml}
              ${returnNoteDisplay}
            </td>
            <td>
              <div class="channel-box">
                <input type="text" id="channel_msg_${key}" placeholder="Type instruction/correction..." style="width:100%; margin-bottom:6px; font-size:0.8rem; padding:6px;">
                <div style="display:flex; gap:6px;">
                  <button onclick="updateTaskStatus('${key}', 'Accepted')" style="background:var(--success); padding:6px 10px; font-size:0.75rem; flex:1;">Accept</button>
                  <button onclick="sendReturnMessage('${key}')" style="background:var(--danger); padding:6px 10px; font-size:0.75rem; flex:1;">Return</button>
                </div>
              </div>
            </td>
          </tr>
        `;
      });
    });
  }

  window.updateTaskStatus = (key, status) => {
    update(ref(db, `tasks/${key}`), { status }).then(() => {
      alert(`Task marked as ${status}.`);
    });
  };

  window.sendReturnMessage = (key) => {
    const msgInput = document.getElementById(`channel_msg_${key}`);
    const message = msgInput.value.trim();
    if (!message) {
      alert("Please type a message before returning the task.");
      return;
    }

    update(ref(db, `tasks/${key}`), {
      status: 'Returned',
      returnNote: message
    }).then(() => {
      alert("Return message sent to operative's channel.");
      msgInput.value = '';
    });
  };

  window.dlmLogout = () => {
    localStorage.removeItem('lingua_dlm_name');
    location.reload();
  };
</script>
</body>
</html>
