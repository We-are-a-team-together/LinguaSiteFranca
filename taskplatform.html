<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - Task Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app"></div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, set, onValue, query, orderByChild, equalTo, get } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null;
        let currentAuthUser = null;
        let currentTaskId = null;
        const appDiv = document.getElementById('app');

        const translations = {
            'en': { 
                taskTitle: 'Your Task', 
                submitBtn: 'Submit Task', 
                logout: 'Sign Out',
                commentsLabel: 'Comments',
                photosLabel: 'Photos (1-3)',
                noTask: 'No active task assigned.',
                statusPending: 'Pending',
                statusRevision: 'Needs Revision',
                statusApproved: 'Approved',
                feedbackTitle: 'Manager Feedback'
            },
            'ro': { 
                taskTitle: 'Sarcina Ta', 
                submitBtn: 'Trimite Sarcina', 
                logout: 'Deconectare',
                commentsLabel: 'Comentarii',
                photosLabel: 'Fotografii (1-3)',
                noTask: 'Nicio sarcină activă atribuită.',
                statusPending: 'În așteptare',
                statusRevision: 'Necesită Revizuire',
                statusApproved: 'Aprobat',
                feedbackTitle: 'Feedback Manager'
            }
        };

        function showLogin() {
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-6">Operative Portal</h1>
                        <form id="loginForm" class="space-y-4">
                            <input type="email" id="loginEmail" placeholder="Email" required class="w-full p-3 border rounded-lg">
                            <input type="password" id="loginPassword" placeholder="Password" required class="w-full p-3 border rounded-lg">
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Sign In</button>
                        </form>
                        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const errorMsg = document.getElementById('errorMsg');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        function showTaskInterface(lang = 'en') {
            const t = translations[lang] || translations['en'];

            appDiv.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
                    <div class="max-w-lg mx-auto flex justify-between items-center">
                        <h1 class="text-lg font-bold">LinguaSiteFranca</h1>
                        <button id="logoutBtn" class="text-sm text-red-600">${t.logout}</button>
                    </div>
                </nav>

                <div class="max-w-lg mx-auto px-6 py-8 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500">
                        <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">${t.taskTitle}</h2>
                        <p id="taskDescription" class="text-lg font-semibold text-gray-800">${t.noTask}</p>
                        <div id="taskStatusContainer" class="mt-2">
                            <span id="taskStatus" class="inline-block px-3 py-1 rounded-full text-xs bg-gray-100 text-gray-600">Checking...</span>
                        </div>
                    </div>

                    <div id="feedbackCard" class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-indigo-500 hidden">
                        <h2 class="text-xs font-bold text-indigo-500 uppercase mb-2">${t.feedbackTitle}</h2>
                        <p id="feedbackText" class="text-gray-700"></p>
                    </div>

                    <form id="submitTaskForm" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                        <h2 class="text-lg font-bold">${t.submitBtn}</h2>
                        <div>
                            <label class="block text-sm font-medium mb-1">${t.photosLabel}</label>
                            <input type="file" id="photoInput" accept="image/*" multiple class="w-full p-3 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">${t.commentsLabel}</label>
                            <textarea id="operativeComment" rows="3" class="w-full p-3 border rounded-lg"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg">${t.submitBtn}</button>
                    </form>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
            document.getElementById('submitTaskForm').addEventListener('submit', handleSubmitTask);
            loadTask(lang);
        }

        async function handleSubmitTask(e) {
            e.preventDefault();
            
            if (!currentTaskId) {
                alert('No active task');
                return;
            }

            const photoInput = document.getElementById('photoInput');
            const comment = document.getElementById('operativeComment').value;

            if (photoInput.files.length === 0) {
                alert('Please attach at least 1 photo');
                return;
            }

            try {
                const photos = [];
                for (let file of photoInput.files) {
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                    photos.push(base64);
                }

                const taskRef = ref(db, `tasks/${currentTaskId}`);
                const taskSnapshot = await get(taskRef);
                const taskData = taskSnapshot.val();

                await set(taskRef, {
                    ...taskData,
                    status: 'submitted',
                    operative_comment_native: comment,
                    photos: photos,
                    submittedAt: new Date().toISOString()
                });

                alert('✅ Task submitted!');
                location.reload();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        function loadTask(lang = 'en') {
            const t = translations[lang] || translations['en'];
            if (!currentAuthUser) return;

            const q = query(ref(db, 'tasks'), orderByChild('operativeId'), equalTo(currentAuthUser.uid));
            
            onValue(q, (snapshot) => {
                let foundTask = false;
                snapshot.forEach((child) => {
                    const task = child.val();
                    // Show active tasks assigned, rejected (needs revision), or even submitted/approved for visibility
                    currentTaskId = child.key;
                    foundTask = true;

                    document.getElementById('taskDescription').textContent = task.description_en || t.noTask;
                    
                    const statusEl = document.getElementById('taskStatus');
                    const feedbackCard = document.getElementById('feedbackCard');
                    const feedbackText = document.getElementById('feedbackText');
                    
                    if (task.status === 'assigned') {
                        statusEl.textContent = t.statusPending;
                        statusEl.className = 'inline-block px-3 py-1 rounded-full text-xs bg-yellow-100 text-yellow-800 font-medium';
                        feedbackCard.classList.add('hidden');
                    } else if (task.status === 'rejected') {
                        statusEl.textContent = t.statusRevision;
                        statusEl.className = 'inline-block px-3 py-1 rounded-full text-xs bg-red-100 text-red-800 font-medium';
                        if (task.dlm_feedback_en) {
                            feedbackText.textContent = task.dlm_feedback_en;
                            feedbackCard.classList.remove('hidden');
                        }
                    } else if (task.status === 'submitted') {
                        statusEl.textContent = 'Submitted - Under Review';
                        statusEl.className = 'inline-block px-3 py-1 rounded-full text-xs bg-blue-100 text-blue-800 font-medium';
                        feedbackCard.classList.add('hidden');
                    } else if (task.status === 'approved') {
                        statusEl.textContent = t.statusApproved;
                        statusEl.className = 'inline-block px-3 py-1 rounded-full text-xs bg-green-100 text-green-800 font-medium';
                        if (task.dlm_feedback_en) {
                            feedbackText.textContent = task.dlm_feedback_en;
                            feedbackCard.classList.remove('hidden');
                        }
                    }
                });

                if (!foundTask) {
                    document.getElementById('taskDescription').textContent = t.noTask;
                    document.getElementById('taskStatus').textContent = 'No Task';
                    document.getElementById('taskStatus').className = 'inline-block px-3 py-1 rounded-full text-xs bg-gray-100 text-gray-600';
                }
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentAuthUser = user;
                try {
                    const userSnapshot = await get(ref(db, `users/${user.uid}`));
                    if (userSnapshot.exists()) {
                        currentUser = userSnapshot.val();
                        if (currentUser.role === 'operative') {
                            const lang = currentUser.nativeLanguage || 'en';
                            showTaskInterface(lang);
                        } else {
                            alert('Access denied: Operative account required');
                            signOut(auth);
                        }
                    } else {
                        alert('User profile not found');
                        signOut(auth);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showLogin();
                }
            } else {
                currentAuthUser = null;
                currentUser = null;
                showLogin();
            }
        });
    </script>
</body>
</html>
