<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Member Workspace</title>
<style>
:root {
--bg: #0f172a;
--card-bg: #1e293b;
--accent: #3b82f6;
--accent-hover: #2563eb;
--text: #f8fafc;
--text-muted: #94a3b8;
--border: #334155;
--success: #10b981;
--danger: #ef4444;
--warning: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
html, body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
body { padding: clamp(10px, 2vw, 20px); }
.login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
.login-card { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; text-align: center; }
.login-card h2 { color: var(--accent); margin-bottom: 8px; font-size: 1.4rem; }
.login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
.login-logo { max-width: 120px; max-height: 80px; margin: 0 auto 15px; display: none; }
.container { width: 100%; max-width: 1400px; margin: 0 auto; display: none; flex-direction: column; min-height: 95vh; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 12px; }
.header-brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-logo { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; display: none; }
.header-title { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 700; color: #fff; }
.lang-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lang-input { padding: 9px 12px; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; width: 100%; min-width: 180px; max-width: 260px; }
.lang-input:focus { outline: none; border-color: var(--accent); }
.card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: clamp(15px, 2vw, 25px); margin-bottom: 18px; }
.task-title { font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 700; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.task-ref { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
.task-desc { font-size: 1rem; line-height: 1.5; margin-bottom: 15px; color: #fff; background: rgba(0,0,0,0.25); padding: 14px; border-radius: 6px; border-left: 4px solid var(--accent); word-wrap: break-word; }
.return-note-desc { font-size: 1rem; line-height: 1.5; margin-bottom: 15px; color: #fff; background: rgba(239,68,68,0.1); padding: 14px; border-radius: 6px; border-left: 4px solid var(--danger); word-wrap: break-word; }
.locked-banner { background: rgba(245,158,11,0.15); border: 1px solid var(--warning); color: var(--warning); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; font-weight: 600; text-align: center; }
.completed-banner { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: var(--success); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; font-weight: 600; text-align: center; }
.item-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 12px; }
.thumb-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); margin-top: 8px; display: block; }
.thumb-img:hover { transform: scale(1.05); transition: transform 0.2s; }
.dlm-ref-photo { margin-top: 10px; }
.dlm-ref-photo small { color: var(--text-muted); font-size: 0.8rem; display: block; margin-bottom: 4px; }
.form-group { margin-bottom: 14px; }
label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; text-align: left; }
textarea, input[type="file"], input[type="text"], input[type="password"] { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
button { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
button:hover:not(:disabled) { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-login { background: var(--accent); margin-top: 10px; }
.empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 1rem; }
.dynamic-footer { margin-top: auto; padding-top: 20px; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
.modal { display: none; position: fixed; z-index: 3000; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; }
.modal img { max-width: 100%; max-height: 100%; border-radius: 8px; border: 2px solid var(--border); }
@media (max-width: 600px) {
.header-title { font-size: 1rem; }
.lang-input { min-width: 140px; }
.thumb-img { width: 60px; height: 60px; }
}
</style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
<div class="login-card">
<img id="loginLogo" class="login-logo" src="" alt="Logo">
<h2 id="loginTitle">Team Member Login</h2>
<p id="loginSubtitle">Enter your credentials provided by your Site Supervisor</p>
<form id="opLoginForm">
<div class="form-group">
<input type="text" id="opLoginName" placeholder="Your Name" required autocomplete="username">
</div>
<div class="form-group">
<input type="password" id="opLoginPassword" placeholder="Password" required autocomplete="current-password">
</div>
<button type="submit" class="btn-login" id="loginBtn">Access Workspace</button>
</form>
<p id="loginError" style="color: var(--danger); margin-top: 12px; font-size: 0.85rem; display: none;"></p>
</div>
</div>
<div class="container" id="mainContainer">
<header>
<div class="header-brand">
<img id="headerLogo" class="header-logo" src="" alt="Logo">
<div class="header-title"><span class="brand-name">Workspace</span> — <span id="opDisplayName">Team Member</span></div>
</div>
<div class="lang-container">
<label for="langInput" style="font-size: 0.85rem; color: var(--text-muted); margin: 0;" id="langLabel">Language:</label>
<input list="languagesList" id="langInput" class="lang-input" placeholder="English">
<datalist id="languagesList"></datalist>
</div>
</header>
<div id="tasksContainer">
<div class="empty-state" id="loadingMsg">Loading your assignments...</div>
</div>
<div class="dynamic-footer"></div>
</div>
<div class="modal" id="imgModal" onclick="this.style.display='none'">
<img id="modalImg" src="" alt="Zoom">
</div>
<script type="module">

const db = getDatabase(app);

// ====== PHOTO COMPRESSION (NEW - reduces file size before upload) ======
async function compressImage(file, options = {}) {
  const { maxWidth = 1600, maxHeight = 1600, quality = 0.75, skipIfUnderKB = 200 } = options;
  if (file.size <= skipIfUnderKB * 1024) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  try {
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width > maxWidth || height > maxHeight) {
      const ratio = Math.min(maxWidth / width, maxHeight / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(bitmap, 0, 0, width, height);
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    bitmap.close();
    if (dataUrl.length > file.size * 1.4) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    console.log(`[Compression] ${Math.round(file.size/1024)}KB → ${Math.round(dataUrl.length*0.75/1024)}KB`);
    return dataUrl;
  } catch (e) {
    console.warn('[Compression] Failed, using original:', e);
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
}
// ====== END PHOTO COMPRESSION ======

let currentOp = "";
let currentLangCode = 'en';
const UI_TEXT = {
loginTitle: "Team Member Login",
loginSubtitle: "Enter your credentials provided by your Site Supervisor",
loginBtn: "Access Workspace",
langLabel: "Language:",
loadingMsg: "Loading your assignments...",
noWork: "No active assignments for",
completedBanner: "✓ Completed — Awaiting final review",
lockedBanner: "⏳ Submitted — Under review by your supervisor",
supervisorNote: "Supervisor Note:",
refImage: "Reference image from supervisor:",
yourPhoto: "Your submitted photo",
yourComment: "Your submitted comment",
photoEvidence: "Photo Evidence *",
commentNotes: "Comment / Notes *",
submitAssignment: "Submit Assignment",
reportTitle: "Report:",
location: "Location:",
supervisor: "Supervisor:",
refImageItem: "Reference image:",
uploadPhoto: "Upload Photo Evidence *",
commentNote: "Comment / Note *",
submitReport: "Submit Report Updates",
item: "Item",
assigned: "Assigned",
completedReport: "✓ Report completed — Awaiting final review",
submittedReport: "⏳ Report submitted — Under review by your supervisor"
};
let translatedUI = { ...UI_TEXT };
onValue(ref(db, 'branding'), (snapshot) => {
const data = snapshot.val();
if (!data) return;
if (data.businessName) {
document.querySelectorAll('.brand-name').forEach(el => el.innerText = data.businessName);
document.title = `${data.businessName} - Team Member Workspace`;
}
if (data.footerText) {
document.querySelectorAll('.dynamic-footer').forEach(el => el.innerText = data.footerText);
}
if (data.logo) {
document.getElementById('loginLogo').src = data.logo;
document.getElementById('loginLogo').style.display = 'block';
document.getElementById('headerLogo').src = data.logo;
document.getElementById('headerLogo').style.display = 'block';
}
if (data.primaryColor) document.documentElement.style.setProperty('--accent', data.primaryColor);
if (data.secondaryColor) document.documentElement.style.setProperty('--success', data.secondaryColor);
});
const LANG_MAP = {
"afrikaans":"af","albanian":"sq","amharic":"am","arabic":"ar","armenian":"hy",
"azerbaijani":"az","basque":"eu","belarusian":"be","bengali":"bn","bosnian":"bs",
"bulgarian":"bg","catalan":"ca","cebuano":"ceb","chinese":"zh-CN","corsican":"co",
"croatian":"hr","czech":"cs","danish":"da","dutch":"nl","english":"en",
"esperanto":"eo","estonian":"et","finnish":"fi","french":"fr","frisian":"fy",
"galician":"gl","georgian":"ka","german":"de","greek":"el","gujarati":"gu",
"haitian creole":"ht","hausa":"ha","hawaiian":"haw","hebrew":"he","hindi":"hi",
"hmong":"hmn","hungarian":"hu","icelandic":"is","igbo":"ig","indonesian":"id",
"irish":"ga","italian":"it","japanese":"ja","javanese":"jw","kannada":"kn",
"kazakh":"kk","khmer":"km","korean":"ko","kurdish":"ku","kyrgyz":"ky",
"lao":"lo","latin":"la","latvian":"lv","lithuanian":"lt","luxembourgish":"lb",
"macedonian":"mk","malagasy":"mg","malay":"ms","malayalam":"ml","maltese":"mt",
"maori":"mi","marathi":"mr","mongolian":"mn","myanmar":"my","nepali":"ne",
"norwegian":"no","nyanja":"ny","pashto":"ps","persian":"fa","polish":"pl",
"portuguese":"pt","punjabi":"pa","romanian":"ro","russian":"ru","samoan":"sm",
"scots gaelic":"gd","serbian":"sr","sesotho":"st","shona":"sn","sindhi":"sd",
"sinhala":"si","slovak":"sk","slovenian":"sl","somali":"so","spanish":"es",
"sundanese":"su","swahili":"sw","swedish":"sv","tagalog":"tl","tajik":"tg",
"tamil":"ta","tatar":"tt","telugu":"te","thai":"th","turkish":"tr",
"turkmen":"tk","ukrainian":"uk","urdu":"ur","uyghur":"ug","uzbek":"uz",
"vietnamese":"vi","welsh":"cy","xhosa":"xh","yiddish":"yi","yoruba":"yo","zulu":"zu"
};
const datalist = document.getElementById('languagesList');
Object.keys(LANG_MAP).forEach(langName => {
const opt = document.createElement('option');
opt.value = langName.charAt(0).toUpperCase() + langName.slice(1);
datalist.appendChild(opt);
});
function resolveLanguageCode(input) {
if (!input) return 'en';
const clean = input.trim().toLowerCase();
if (LANG_MAP[clean]) return LANG_MAP[clean];
if (clean.length === 2) return clean;
const found = Object.keys(LANG_MAP).find(k => k.includes(clean) || clean.includes(k));
return found ? LANG_MAP[found] : 'en';
}
async function translateText(text, targetLangCode) {
if (!text || targetLangCode === 'en') return text;
try {
const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(text)}`);
const data = await res.json();
return data[0][0][0];
} catch (e) { return text; }
}
async function translateUI(targetLangCode) {
if (targetLangCode === 'en') {
translatedUI = { ...UI_TEXT };
} else {
const texts = Object.values(UI_TEXT);
const promises = texts.map(t => translateText(t, targetLangCode));
const results = await Promise.all(promises);
translatedUI = {};
Object.keys(UI_TEXT).forEach((key, i) => {
translatedUI[key] = results[i];
});
}
document.getElementById('loginTitle').innerText = translatedUI.loginTitle;
document.getElementById('loginSubtitle').innerText = translatedUI.loginSubtitle;
document.getElementById('loginBtn').innerText = translatedUI.loginBtn;
document.getElementById('langLabel').innerText = translatedUI.langLabel;
document.getElementById('loadingMsg').innerText = translatedUI.loadingMsg;
}
document.getElementById('opLoginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const name = document.getElementById('opLoginName').value.trim();
const pwd = document.getElementById('opLoginPassword').value;
const errEl = document.getElementById('loginError');
errEl.style.display = 'none';
const snap = await new Promise(resolve => onValue(ref(db, 'operatives'), resolve, { onlyOnce: true }));
const ops = snap.val() || {};
const match = Object.values(ops).find(o =>
o.name && o.name.toLowerCase() === name.toLowerCase() && o.password === pwd
);
if (!match) {
errEl.innerText = 'Invalid name or password. Please check your credentials.';
errEl.style.display = 'block';
return;
}
currentOp = match.name;
document.getElementById('loginOverlay').style.display = 'none';
document.getElementById('mainContainer').style.display = 'flex';
document.getElementById('opDisplayName').innerText = currentOp;
renderAllWork();
});
let renderTimeout;
document.getElementById('langInput').addEventListener('input', async () => {
clearTimeout(renderTimeout);
renderTimeout = setTimeout(async () => {
const userInput = document.getElementById('langInput').value;
currentLangCode = resolveLanguageCode(userInput);
await translateUI(currentLangCode);
renderAllWork();
}, 300);
});
window.renderAllWork = async function() {
if (!currentOp) return;
const container = document.getElementById('tasksContainer');
container.innerHTML = `<div class="empty-state">${translatedUI.loadingMsg}</div>`;
let loadedCount = 0;
let tasksData = {}, reportsData = {};
function checkAndDisplay() {
loadedCount++;
if (loadedCount < 2) return;
container.innerHTML = '';
let hasWork = false;
for (const key of Object.keys(tasksData)) {
const task = tasksData[key];
if (task.operative && task.operative.toLowerCase() === currentOp.toLowerCase()) {
hasWork = true;
renderTaskCard(key, task, container);
}
}
for (const key of Object.keys(reportsData)) {
const rep = reportsData[key];
let isAssigned = false;
if (rep.assignedTo) {
if (Array.isArray(rep.assignedTo)) isAssigned = rep.assignedTo.some(n => n.toLowerCase() === currentOp.toLowerCase());
else if (typeof rep.assignedTo === 'object') isAssigned = Object.values(rep.assignedTo).some(n => n.toLowerCase() === currentOp.toLowerCase());
else if (typeof rep.assignedTo === 'string') isAssigned = rep.assignedTo.toLowerCase().includes(currentOp.toLowerCase());
}
if (isAssigned) {
hasWork = true;
renderReportCard(key, rep, container);
}
}
if (!hasWork) {
container.innerHTML = `<div class="empty-state">${translatedUI.noWork} ${currentOp}.</div>`;
}
}
onValue(ref(db, 'tasks'), (s) => { tasksData = s.val() || {}; checkAndDisplay(); }, { onlyOnce: true });
onValue(ref(db, 'reports'), (s) => { reportsData = s.val() || {}; checkAndDisplay(); }, { onlyOnce: true });
};
async function renderTaskCard(key, task, container) {
const translatedDetails = await translateText(task.details || '', currentLangCode);
const isLocked = task.status === 'Submitted' || task.status === 'Accepted' || task.status === 'Approved';
const isCompleted = task.status === 'Accepted' || task.status === 'Approved';
let bannerHTML = '';
if (isCompleted) bannerHTML = `<div class="completed-banner">${translatedUI.completedBanner}</div>`;
else if (task.status === 'Submitted') bannerHTML = `<div class="locked-banner">${translatedUI.lockedBanner}</div>`;
let returnNoteHTML = '';
if (task.returnNote) {
const tNote = await translateText(task.returnNote, currentLangCode);
returnNoteHTML = `<div class="return-note-desc"><strong>${translatedUI.supervisorNote}</strong><br>${tNote}</div>`;
}
let dlmPhotoHTML = '';
if (task.dlmPhoto) {
dlmPhotoHTML = `<div class="dlm-ref-photo"><small>${translatedUI.refImage}</small><img src="${task.dlmPhoto}" class="thumb-img" onclick="openModal('${task.dlmPhoto}')"></div>`;
}
let formHTML = '';
if (isLocked) {
if (task.photo || task.operativePhoto) {
const opPhoto = task.operativePhoto || task.photo;
formHTML += `<div class="form-group"><label>${translatedUI.yourPhoto}</label><img src="${opPhoto}" class="thumb-img" onclick="openModal('${opPhoto}')"></div>`;
}
if (task.comment) {
const tc = await translateText(task.comment, currentLangCode);
formHTML += `<div class="form-group"><label>${translatedUI.yourComment}</label><div class="task-desc" style="border-left-color: var(--success);">${tc}</div></div>`;
}
} else {
formHTML = `
<form onsubmit="submitTask(event, '${key}')" novalidate>
<div class="form-group">
<label>${translatedUI.photoEvidence}</label>
<input type="file" id="photo_${key}" accept="image/*" capture="environment" required>
</div>
<div class="form-group">
<label>${translatedUI.commentNotes}</label>
<textarea id="comment_${key}" rows="3" required placeholder="Describe what you have done..."></textarea>
</div>
<button type="submit">${translatedUI.submitAssignment}</button>
</form>
`;
}
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<div class="task-title">
<span>${translatedUI.assigned} ${task.status ? `(${task.status})` : ''}</span>
<span class="task-ref">Ref: ${task.refNumber || key.substring(0,8)}</span>
</div>
<div class="task-desc">${translatedDetails || 'No description provided'}</div>
${dlmPhotoHTML}
${bannerHTML}
${returnNoteHTML}
${formHTML}
`;
container.appendChild(card);
}
async function renderReportCard(key, rep, container) {
const rawItems = rep.items;
const itemsArray = rawItems ? (Array.isArray(rawItems) ? [...rawItems] : Object.values(rawItems)) : [];
const isReportLocked = rep.status === 'Submitted' || rep.status === 'Accepted' || rep.status === 'Approved';
const isReportCompleted = rep.status === 'Accepted' || rep.status === 'Approved';
let bannerHTML = '';
if (isReportCompleted) bannerHTML = `<div class="completed-banner">${translatedUI.completedReport}</div>`;
else if (rep.status === 'Submitted') bannerHTML = `<div class="locked-banner">${translatedUI.submittedReport}</div>`;
let returnNoteHTML = '';
if (rep.returnNote) {
const tNote = await translateText(rep.returnNote, currentLangCode);
returnNoteHTML = `<div class="return-note-desc"><strong>${translatedUI.supervisorNote}</strong><br>${tNote}</div>`;
}
let itemsHtml = '';
for (let i = 0; i < itemsArray.length; i++) {
const item = itemsArray[i];
const itemText = item.description || item.title || item.details || `${translatedUI.item} ${i + 1}`;
const translatedItem = await translateText(itemText, currentLangCode);
const itemLocked = item.status === 'Submitted' || item.status === 'Accepted' || isReportLocked;
let dlmPhotoHtml = item.photo ? `<div class="dlm-ref-photo"><small>${translatedUI.refImageItem}</small><img src="${item.photo}" class="thumb-img" onclick="openModal('${item.photo}')"></div>` : '';
let itemFormHtml = '';
if (itemLocked) {
if (item.submittedPhoto || item.operativePhoto) {
const opPhoto = item.submittedPhoto || item.operativePhoto;
itemFormHtml += `<div class="form-group"><label>${translatedUI.yourPhoto}</label><img src="${opPhoto}" class="thumb-img" onclick="openModal('${opPhoto}')"></div>`;
}
if (item.comment) {
const tc = await translateText(item.comment, currentLangCode);
itemFormHtml += `<div class="form-group"><label>${translatedUI.yourComment}</label><div class="task-desc" style="border-left-color: var(--success);">${tc}</div></div>`;
}
} else {
itemFormHtml = `
<div class="form-group"><label>${translatedUI.uploadPhoto}</label><input type="file" id="report_photo_${key}_${i}" accept="image/*" capture="environment" required></div>
<div class="form-group"><label>${translatedUI.commentNote}</label><textarea id="report_comment_${key}_${i}" rows="2" required placeholder="Describe your progress..."></textarea></div>
`;
}
itemsHtml += `
<div class="item-box">
<strong>${translatedUI.item} ${i + 1}:</strong> ${translatedItem} <small style="color:var(--text-muted);">(${item.status || translatedUI.assigned})</small>
${dlmPhotoHtml}
${itemFormHtml}
</div>
`;
}
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<div class="task-title">
<span>${translatedUI.reportTitle} ${rep.title || 'Untitled'} (${rep.status || translatedUI.assigned})</span>
<span class="task-ref">Ref: ${rep.refNumber || key.substring(0,8)}</span>
</div>
<div class="task-desc">
<strong>${translatedUI.location}</strong> ${rep.site || 'N/A'}<br>
<strong>${translatedUI.supervisor}</strong> ${rep.dlm || 'N/A'}
</div>
${bannerHTML}
${returnNoteHTML}
<form onsubmit="submitReport(event, '${key}', ${itemsArray.length})" novalidate>
${itemsHtml}
${!isReportLocked ? `<button type="submit">${translatedUI.submitReport}</button>` : ''}
</form>
`;
container.appendChild(card);
}
window.openModal = (src) => {
document.getElementById('modalImg').src = src;
document.getElementById('imgModal').style.display = 'flex';
};
// ====== MODIFIED: submitTask now uses compression ======
window.submitTask = async (e, key) => {
e.preventDefault();
console.log("submitTask triggered. Key:", key);
try {
const comment = document.getElementById(`comment_${key}`).value.trim();
const fileInput = document.getElementById(`photo_${key}`);
if (!comment || fileInput.files.length === 0) {
return alert('Both a photo and a comment are required before submitting.');
}
const file = fileInput.files[0];
const photoData = await compressImage(file);
const now = new Date().toISOString();
const snapshot = await new Promise(resolve => onValue(ref(db, `tasks/${key}`), resolve, { onlyOnce: true }));
const existing = snapshot.val() || {};
const history = existing.history || [];
history.push({ action: 'Submitted by team member', timestamp: now, comment });
await update(ref(db, `tasks/${key}`), {
status: 'Submitted',
comment: comment,
operativePhoto: photoData,
photo: photoData,
submittedAt: now,
history: history
});
alert('Assignment submitted successfully!');
renderAllWork();
} catch (error) {
console.error("Error in submitTask:", error);
alert("An error occurred while submitting the task: " + error.message);
}
};
// ====== MODIFIED: submitReport now uses compression ======
window.submitReport = async (e, key, itemCount) => {
e.preventDefault();
console.log("submitReport triggered. Key:", key, "ItemCount:", Number(itemCount));
try {
const snapshot = await new Promise(resolve => onValue(ref(db, `reports/${key}`), resolve, { onlyOnce: true }));
const rep = snapshot.val();
if (!rep) {
alert('Report not found in database.');
return;
}
let rawItems = rep.items;
let itemsArray = rawItems ? (Array.isArray(rawItems) ? [...rawItems] : Object.values(rawItems)) : [];
const now = new Date().toISOString();
let anyChanges = false;
const totalItems = Number(itemCount);
console.log("Total items in report:", itemsArray.length);
for (let i = 0; i < totalItems; i++) {
const commentEl = document.getElementById(`report_comment_${key}_${i}`);
const fileEl = document.getElementById(`report_photo_${key}_${i}`);
if (!commentEl || !fileEl) {
console.log(`Item ${i} input elements not found in DOM. Skipping (likely already submitted/locked).`);
continue;
}
const comment = commentEl.value.trim();
if (!comment || fileEl.files.length === 0) {
alert(`${translatedUI.item} ${i+1}: Both photo and comment are required.`);
return;
}
const file = fileEl.files[0];
const photoData = await compressImage(file);
if (itemsArray[i]) {
const itemHistory = itemsArray[i].history || [];
itemHistory.push({ action: 'Submitted by team member', timestamp: now, comment });
itemsArray[i].comment = comment;
itemsArray[i].status = 'Submitted';
itemsArray[i].submittedPhoto = photoData;
itemsArray[i].operativePhoto = photoData;
itemsArray[i].submittedAt = now;
itemsArray[i].history = itemHistory;
anyChanges = true;
console.log(`Item ${i} processed successfully.`);
} else {
console.warn(`Item ${i} not found in itemsArray.`);
}
}
if (!anyChanges) {
alert('No items were submitted. Please ensure you have filled out the required fields for at least one active item.');
return;
}
const reportHistory = rep.history || [];
reportHistory.push({ action: 'Report submitted by team member', timestamp: now });
await update(ref(db, `reports/${key}`), {
status: 'Submitted',
items: itemsArray,
submittedAt: now,
history: reportHistory
});
alert('Report submitted successfully!');
renderAllWork();
} catch (error) {
console.error("Error in submitReport:", error);
alert("An error occurred while submitting the report: " + error.message);
}
};
</script>
