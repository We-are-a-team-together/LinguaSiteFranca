<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Member Workspace</title>
<style>
:root {
--bg: #0f172a;
--card-bg: #1e293b;
--accent: #3b82f6;
--accent-hover: #2563eb;
--text: #f8fafc;
--text-muted: #94a3b8;
--border: #334155;
--success: #10b981;
--danger: #ef4444;
--warning: #f59e0b;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body {
background-color: var(--bg);
color: var(--text);
min-height: 100vh;
}
body { padding: clamp(10px, 2vw, 20px); }
/* ---------- LOGIN SCREEN ---------- */
.login-overlay {
position: fixed;
inset: 0;
background: var(--bg);
display: flex;
justify-content: center;
align-items: center;
z-index: 2000;
padding: 20px;
}
.login-card {
width: 100%;
max-width: 420px;
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px;
padding: 28px;
text-align: center;
}
.login-card h2 {
color: var(--accent);
margin-bottom: 8px;
font-size: 1.4rem;
}
.login-card p {
color: var(--text-muted);
font-size: 0.9rem;
margin-bottom: 20px;
}
.login-logo {
max-width: 120px;
max-height: 80px;
margin: 0 auto 15px;
display: none;
}
.lang-selector {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 20px;
justify-content: center;
}
.lang-selector label {
font-size: 0.85rem;
color: var(--text-muted);
}
.lang-selector select {
padding: 8px 12px;
border-radius: 6px;
border: 1px solid var(--border);
background: var(--bg);
color: var(--text);
font-size: 0.9rem;
cursor: pointer;
}
.form-group { margin-bottom: 14px; }
.form-group label {
display: block;
font-size: 0.85rem;
color: var(--text-muted);
margin-bottom: 5px;
text-align: left;
}
.form-group input,
.form-group textarea,
.form-group select {
width: 100%;
padding: 10px;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 6px;
color: #fff;
font-size: 0.95rem;
}
.form-group input:focus,
.form-group textarea:focus {
outline: none;
border-color: var(--accent);
}
.btn-login {
width: 100%;
padding: 12px;
background: var(--accent);
color: white;
border: none;
border-radius: 6px;
font-weight: 600;
cursor: pointer;
font-size: 1rem;
margin-top: 10px;
transition: opacity 0.2s;
}
.btn-login:hover { opacity: 0.9; }
.login-error {
color: var(--danger);
margin-top: 12px;
font-size: 0.85rem;
display: none;
}
/* ---------- MAIN WORKSPACE ---------- */
.container {
width: 100%;
max-width: 1400px;
margin: 0 auto;
display: none;
flex-direction: column;
min-height: 95vh;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
border-bottom: 1px solid var(--border);
padding-bottom: 15px;
flex-wrap: wrap;
gap: 12px;
}
.header-brand {
display: flex;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}
.header-logo {
width: 44px;
height: 44px;
object-fit: contain;
border-radius: 6px;
display: none;
}
.header-title {
font-size: clamp(1rem, 2.5vw, 1.3rem);
font-weight: 700;
color: #fff;
}
.header-controls {
display: flex;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}
.lang-container {
display: flex;
align-items: center;
gap: 8px;
flex-wrap: wrap;
}
.lang-container select {
padding: 8px 12px;
background: var(--card-bg);
border: 1px solid var(--border);
color: #fff;
border-radius: 6px;
font-size: 0.9rem;
cursor: pointer;
}
.logout-btn {
padding: 8px 16px;
background: transparent;
border: 1px solid var(--danger);
color: var(--danger);
border-radius: 6px;
font-size: 0.85rem;
cursor: pointer;
transition: all 0.2s;
}
.logout-btn:hover {
background: var(--danger);
color: #fff;
}
/* ---------- CARDS ---------- */
.card {
background-color: var(--card-bg);
border: 1px solid var(--border);
border-radius: 10px;
padding: clamp(15px, 2vw, 25px);
margin-bottom: 18px;
}
.task-title {
font-size: clamp(1rem, 2vw, 1.2rem);
font-weight: 700;
color: var(--accent);
margin-bottom: 8px;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 8px;
}
.task-ref {
font-size: 0.75rem;
color: var(--text-muted);
font-weight: 400;
}
.task-desc {
font-size: 1rem;
line-height: 1.5;
margin-bottom: 15px;
color: #fff;
background: rgba(0,0,0,0.25);
padding: 14px;
border-radius: 6px;
border-left: 4px solid var(--accent);
word-wrap: break-word;
}
.return-note-desc {
font-size: 1rem;
line-height: 1.5;
margin-bottom: 15px;
color: #fff;
background: rgba(239,68,68,0.1);
padding: 14px;
border-radius: 6px;
border-left: 4px solid var(--danger);
word-wrap: break-word;
}
.locked-banner {
background: rgba(245,158,11,0.15);
border: 1px solid var(--warning);
color: var(--warning);
padding: 12px;
border-radius: 6px;
margin-bottom: 15px;
font-size: 0.9rem;
font-weight: 600;
text-align: center;
}
.completed-banner {
background: rgba(16,185,129,0.15);
border: 1px solid var(--success);
color: var(--success);
padding: 12px;
border-radius: 6px;
margin-bottom: 15px;
font-size: 0.9rem;
font-weight: 600;
text-align: center;
}
.item-box {
background: rgba(0,0,0,0.3);
border: 1px solid var(--border);
border-radius: 6px;
padding: 14px;
margin-bottom: 12px;
}
.thumb-img {
width: 80px;
height: 80px;
object-fit: cover;
border-radius: 6px;
cursor: pointer;
border: 1px solid var(--border);
margin-top: 8px;
display: block;
}
.thumb-img:hover {
transform: scale(1.05);
transition: transform 0.2s;
}
.dlm-ref-photo { margin-top: 10px; }
.dlm-ref-photo small {
color: var(--text-muted);
font-size: 0.8rem;
display: block;
margin-bottom: 4px;
}
button[type="submit"],
button.btn-submit {
width: 100%;
padding: 12px;
background: var(--success);
color: white;
border: none;
border-radius: 6px;
font-weight: 600;
cursor: pointer;
font-size: 1rem;
transition: opacity 0.2s;
}
button[type="submit"]:hover:not(:disabled) { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.empty-state {
text-align: center;
color: var(--text-muted);
padding: 40px 20px;
font-size: 1rem;
}
.dynamic-footer {
margin-top: auto;
padding-top: 20px;
text-align: center;
font-size: 0.8rem;
color: var(--text-muted);
}
/* ---------- IMAGE MODAL ---------- */
.modal {
display: none;
position: fixed;
z-index: 3000;
inset: 0;
background: rgba(0,0,0,0.9);
justify-content: center;
align-items: center;
padding: 20px;
}
.modal img {
max-width: 100%;
max-height: 100%;
border-radius: 8px;
border: 2px solid var(--border);
}
@media (max-width: 600px) {
.header-title { font-size: 1rem; }
.thumb-img { width: 60px; height: 60px; }
header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<script type="module">

// ---------- Firebase Config ----------

};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ====== PHOTO COMPRESSION (NEW - reduces file size before upload) ======
async function compressImage(file, options = {}) {
  const { maxWidth = 1600, maxHeight = 1600, quality = 0.75, skipIfUnderKB = 200 } = options;
  // If file is already small, skip compression
  if (file.size <= skipIfUnderKB * 1024) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  try {
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width > maxWidth || height > maxHeight) {
      const ratio = Math.min(maxWidth / width, maxHeight / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(bitmap, 0, 0, width, height);
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    bitmap.close();
    // If compression somehow made it bigger, use original
    if (dataUrl.length > file.size * 1.4) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    console.log(`[Compression] ${Math.round(file.size/1024)}KB → ${Math.round(dataUrl.length*0.75/1024)}KB`);
    return dataUrl;
  } catch (e) {
    console.warn('[Compression] Failed, using original:', e);
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
}
// ====== END PHOTO COMPRESSION ======

// ---------- State ----------
let currentOp = "";
let currentLangCode = 'en';
// ---------- UI Text (English base) ----------
const UI_TEXT = {
loginTitle: "Team Member Login",
loginSubtitle: "Enter your credentials provided by your Site Supervisor",
loginBtn: "Access Workspace",
langLabel: "Language:",
nameLabel: "Name",
passwordLabel: "Password",
namePlaceholder: "Your Name",
passwordPlaceholder: "Password",
loginError: "Invalid credentials. Please try again.",
loadingMsg: "Loading your assignments...",
noWork: "No active assignments for",
completedBanner: "✓ Completed — Awaiting final review",
lockedBanner: "⏳ Submitted — Under review by your supervisor",
supervisorNote: "Supervisor Note:",
refImage: "Reference image from supervisor:",
yourPhoto: "Your submitted photo",
yourComment: "Your submitted comment",
photoEvidence: "Photo Evidence *",
commentNotes: "Comment / Notes *",
submitAssignment: "Submit Assignment",
reportTitle: "Report:",
location: "Location:",
supervisor: "Supervisor:",
refImageItem: "Reference image:",
uploadPhoto: "Upload Photo Evidence *",
commentNote: "Comment / Note *",
submitReport: "Submit Report Updates",
item: "Item",
assigned: "Assigned",
completedReport: "✓ Report completed — Awaiting final review",
submittedReport: "⏳ Report submitted — Under review by your supervisor",
logoutBtn: "Logout",
noDescription: "No description provided",
untitled: "Untitled",
submitSuccess: "Assignment submitted successfully!",
submitError: "An error occurred while submitting the task: ",
reportSubmitSuccess: "Report submitted successfully!",
reportSubmitError: "An error occurred while submitting the report: ",
bothRequired: "Both a photo and a comment are required before submitting.",
noItemsSubmitted: "No items were submitted. Please ensure you have filled out the required fields for at least one active item."
};
let translatedUI = { ...UI_TEXT };
// ---------- Translation Engine (Google Translate - FREE, same as dlmplatform/officeplatform) ----------
const translationCache = {};
/**
* Translate text from English to target language.
* Uses the same Google Translate endpoint as dlmplatform.html and officeplatform.html.
* This is FREE with no API key required.
*/
async function translateText(text, targetLangCode) {
if (!text || !text.trim()) return text;
if (targetLangCode === 'en') return text;
const cacheKey = `${text}__${targetLangCode}`;
if (translationCache[cacheKey]) return translationCache[cacheKey];
try {
const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(text)}`;
const res = await fetch(url);
const data = await res.json();
const translated = data[0][0][0];
translationCache[cacheKey] = translated;
return translated;
} catch (e) {
console.warn("Translation failed:", e);
return text;
}
}
/**
* Translate any text to English (auto-detect source language).
* Used for translating team member comments to English for supervisors.
*/
async function translateToEnglish(text) {
if (!text || !text.trim()) return text;
const cacheKey = `${text}__en`;
if (translationCache[cacheKey]) return translationCache[cacheKey];
try {
const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
const res = await fetch(url);
const data = await res.json();
const translated = data[0][0][0];
translationCache[cacheKey] = translated;
return translated;
} catch (e) {
return text;
}
}
// ---------- Translate entire UI ----------
async function translateUI(targetLangCode) {
if (targetLangCode === 'en') {
translatedUI = { ...UI_TEXT };
} else {
translatedUI = {};
const keys = Object.keys(UI_TEXT);
const promises = keys.map(k => translateText(UI_TEXT[k], targetLangCode));
const results = await Promise.all(promises);
keys.forEach((k, i) => { translatedUI[k] = results[i]; });
}
applyUIText();
}
function applyUIText() {
// Login screen
const titleEl = document.getElementById('loginTitle');
if (titleEl) titleEl.innerText = translatedUI.loginTitle;
const subtitleEl = document.getElementById('loginSubtitle');
if (subtitleEl) subtitleEl.innerText = translatedUI.loginSubtitle;
const loginBtnEl = document.getElementById('loginBtn');
if (loginBtnEl) loginBtnEl.innerText = translatedUI.loginBtn;
const langLabelEl = document.getElementById('langLabel');
if (langLabelEl) langLabelEl.innerText = translatedUI.langLabel;
const wsLangLabelEl = document.getElementById('wsLangLabel');
if (wsLangLabelEl) wsLangLabelEl.innerText = translatedUI.langLabel;
const labelNameEl = document.getElementById('labelName');
if (labelNameEl) labelNameEl.innerText = translatedUI.nameLabel;
const labelPassEl = document.getElementById('labelPassword');
if (labelPassEl) labelPassEl.innerText = translatedUI.passwordLabel;
const loginNameEl = document.getElementById('opLoginName');
if (loginNameEl) loginNameEl.placeholder = translatedUI.namePlaceholder;
const loginPassEl = document.getElementById('opLoginPassword');
if (loginPassEl) loginPassEl.placeholder = translatedUI.passwordPlaceholder;
const loginErrorEl = document.getElementById('loginError');
if (loginErrorEl) loginErrorEl.innerText = translatedUI.loginError;
const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) logoutBtn.innerText = translatedUI.logoutBtn;
const loadingMsg = document.getElementById('loadingMsg');
if (loadingMsg && loadingMsg.style.display !== 'none') {
loadingMsg.innerText = translatedUI.loadingMsg;
}
}
// ---------- Language Selector Handlers ----------
document.getElementById('loginLangSelect').addEventListener('change', async (e) => {
currentLangCode = e.target.value;
document.getElementById('wsLangSelect').value = currentLangCode;
await translateUI(currentLangCode);
});
document.getElementById('wsLangSelect').addEventListener('change', async (e) => {
currentLangCode = e.target.value;
document.getElementById('loginLangSelect').value = currentLangCode;
await translateUI(currentLangCode);
window.renderAllWork();
});
// ---------- Branding ----------
onValue(ref(db, 'branding'), (snapshot) => {
const data = snapshot.val();
if (!data) return;
if (data.businessName) {
document.querySelectorAll('.brand-name').forEach(el => el.innerText = data.businessName);
document.title = `${data.businessName} - Team Member Workspace`;
}
if (data.footerText) {
document.querySelectorAll('.dynamic-footer').forEach(el => el.innerText = data.footerText);
}
if (data.logo) {
const loginLogo = document.getElementById('loginLogo');
const headerLogo = document.getElementById('headerLogo');
if (loginLogo) { loginLogo.src = data.logo; loginLogo.style.display = 'block'; }
if (headerLogo) { headerLogo.src = data.logo; headerLogo.style.display = 'block'; }
}
if (data.primaryColor) document.documentElement.style.setProperty('--accent', data.primaryColor);
if (data.secondaryColor) document.documentElement.style.setProperty('--success', data.secondaryColor);
});
// ---------- Login Handler ----------
document.getElementById('opLoginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const name = document.getElementById('opLoginName').value.trim();
const pwd = document.getElementById('opLoginPassword').value;
const errEl = document.getElementById('loginError');
errEl.style.display = 'none';
if (!name || !pwd) {
errEl.style.display = 'block';
return;
}
try {
const snap = await get(ref(db, 'operatives'));
const ops = snap.val() || {};
const match = Object.values(ops).find(o =>
o.name && o.name.toLowerCase() === name.toLowerCase() && o.password === pwd
);
if (!match) {
errEl.style.display = 'block';
return;
}
currentOp = match.name;
document.getElementById('loginOverlay').style.display = 'none';
document.getElementById('mainContainer').style.display = 'flex';
document.getElementById('opDisplayName').innerText = currentOp;
window.renderAllWork();
} catch (err) {
console.error("Login error:", err);
errEl.innerText = "Connection error. Please try again.";
errEl.style.display = 'block';
}
});
// ---------- Logout Handler ----------
document.getElementById('logoutBtn').addEventListener('click', () => {
currentOp = "";
document.getElementById('mainContainer').style.display = 'none';
document.getElementById('loginOverlay').style.display = 'flex';
document.getElementById('opLoginForm').reset();
document.getElementById('loginError').style.display = 'none';
document.getElementById('tasksContainer').innerHTML = `<div class="empty-state" id="loadingMsg">${translatedUI.loadingMsg}</div>`;
});
// ---------- Render All Work ----------
// Global cache for the filtered data
let liveTasksData = {};
let liveReportsData = {};

function renderFilteredWork() {
if (!currentOp) return;
const container = document.getElementById('tasksContainer');
container.innerHTML = '';
let hasWork = false;

// Render Tasks (These are already filtered by the server!)
for (const key of Object.keys(liveTasksData)) {
const task = liveTasksData[key];
hasWork = true;
renderTaskCard(key, task, container);
}

// Render Reports (We still filter these in the browser, see note below)
for (const key of Object.keys(liveReportsData)) {
const rep = liveReportsData[key];
let isAssigned = false;
if (rep.assignedTo) {
if (Array.isArray(rep.assignedTo)) isAssigned = rep.assignedTo.some(n => n.toLowerCase() === currentOp.toLowerCase());
else if (typeof rep.assignedTo === 'object') isAssigned = Object.values(rep.assignedTo).some(n => n.toLowerCase() === currentOp.toLowerCase());
else if (typeof rep.assignedTo === 'string') isAssigned = rep.assignedTo.toLowerCase().includes(currentOp.toLowerCase());
}
if (isAssigned) {
hasWork = true;
renderReportCard(key, rep, container);
}
}

if (!hasWork) {
container.innerHTML = `<div class="empty-state">${translatedUI.noWork} ${currentOp}.</div>`;
}
}

window.renderAllWork = function() {
if (!currentOp) return;
const container = document.getElementById('tasksContainer');
container.innerHTML = `<div class="empty-state">${translatedUI.loadingMsg}</div>`;

// 1. SERVER-SIDE FILTERING FOR TASKS (The "Bill = £0.00" magic)
// This tells Firebase: "Only send tasks where 'operative' exactly matches currentOp"
const tasksQuery = query(ref(db, 'tasks'), orderByChild('operative'), equalTo(currentOp));
onValue(tasksQuery, (snapshot) => {
liveTasksData = snapshot.val() || {};
renderFilteredWork();
});

// 2. CLIENT-SIDE FILTERING FOR REPORTS
// Note: Firebase Realtime DB cannot query inside Arrays. We must download reports 
// and filter them in the browser. Since reports are fewer than tasks, this is fine.
onValue(ref(db, 'reports'), (snapshot) => {
liveReportsData = snapshot.val() || {};
renderFilteredWork();
});
};
// ---------- Render Task Card ----------
async function renderTaskCard(key, task, container) {
const translatedDetails = await translateText(task.details || '', currentLangCode);
const isLocked = task.status === 'Submitted' || task.status === 'Accepted' || task.status === 'Approved';
const isCompleted = task.status === 'Accepted' || task.status === 'Approved';
let bannerHTML = '';
if (isCompleted) bannerHTML = `<div class="completed-banner">${translatedUI.completedBanner}</div>`;
else if (task.status === 'Submitted') bannerHTML = `<div class="locked-banner">${translatedUI.lockedBanner}</div>`;
let returnNoteHTML = '';
if (task.returnNote) {
const tNote = await translateText(task.returnNote, currentLangCode);
returnNoteHTML = `<div class="return-note-desc"><strong>${translatedUI.supervisorNote}</strong><br>${tNote}</div>`;
}
let dlmPhotoHTML = '';
if (task.dlmPhoto) {
const safeSrc = task.dlmPhoto.replace(/'/g, "\\'");
dlmPhotoHTML = `<div class="dlm-ref-photo"><small>${translatedUI.refImage}</small><img src="${task.dlmPhoto}" class="thumb-img" onclick="openModal('${safeSrc}')"></div>`;
}
let formHTML = '';
if (isLocked) {
if (task.photo || task.operativePhoto) {
const opPhoto = task.operativePhoto || task.photo;
const safeSrc = opPhoto.replace(/'/g, "\\'");
formHTML += `<div class="form-group"><label>${translatedUI.yourPhoto}</label><img src="${opPhoto}" class="thumb-img" onclick="openModal('${safeSrc}')"></div>`;
}
if (task.comment) {
const tc = await translateText(task.comment, currentLangCode);
formHTML += `<div class="form-group"><label>${translatedUI.yourComment}</label><div class="task-desc" style="border-left-color: var(--success);">${tc}</div></div>`;
}
} else {
formHTML = `
<form onsubmit="submitTask(event, '${key}')" novalidate>
<div class="form-group">
<label>${translatedUI.photoEvidence}</label>
<input type="file" id="photo_${key}" accept="image/*" capture="environment" required>
</div>
<div class="form-group">
<label>${translatedUI.commentNotes}</label>
<textarea id="comment_${key}" rows="3" required placeholder="Describe what you have done..."></textarea>
</div>
<button type="submit">${translatedUI.submitAssignment}</button>
</form>`;
}
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<div class="task-title">
<span>${translatedUI.assigned} ${task.status ? `(${task.status})` : ''}</span>
<span class="task-ref">Ref: ${task.refNumber || key.substring(0,8)}</span>
</div>
<div class="task-desc">${translatedDetails || translatedUI.noDescription}</div>
${dlmPhotoHTML}
${bannerHTML}
${returnNoteHTML}
${formHTML}
`;
container.appendChild(card);
}
// ---------- Render Report Card ----------
async function renderReportCard(key, rep, container) {
const rawItems = rep.items;
const itemsArray = rawItems ? (Array.isArray(rawItems) ? [...rawItems] : Object.values(rawItems)) : [];
const isReportLocked = rep.status === 'Submitted' || rep.status === 'Accepted' || rep.status === 'Approved';
const isReportCompleted = rep.status === 'Accepted' || rep.status === 'Approved';
let bannerHTML = '';
if (isReportCompleted) bannerHTML = `<div class="completed-banner">${translatedUI.completedReport}</div>`;
else if (rep.status === 'Submitted') bannerHTML = `<div class="locked-banner">${translatedUI.submittedReport}</div>`;
let returnNoteHTML = '';
if (rep.returnNote) {
const tNote = await translateText(rep.returnNote, currentLangCode);
returnNoteHTML = `<div class="return-note-desc"><strong>${translatedUI.supervisorNote}</strong><br>${tNote}</div>`;
}
let itemsHtml = '';
for (let i = 0; i < itemsArray.length; i++) {
const item = itemsArray[i];
const itemText = item.description || item.title || item.details || `${translatedUI.item} ${i + 1}`;
const translatedItem = await translateText(itemText, currentLangCode);
const itemLocked = item.status === 'Submitted' || item.status === 'Accepted' || isReportLocked;
let dlmPhotoHtml = '';
if (item.photo) {
const safeSrc = item.photo.replace(/'/g, "\\'");
dlmPhotoHtml = `<div class="dlm-ref-photo"><small>${translatedUI.refImageItem}</small><img src="${item.photo}" class="thumb-img" onclick="openModal('${safeSrc}')"></div>`;
}
let itemFormHtml = '';
if (itemLocked) {
if (item.submittedPhoto || item.operativePhoto) {
const opPhoto = item.submittedPhoto || item.operativePhoto;
const safeSrc = opPhoto.replace(/'/g, "\\'");
itemFormHtml += `<div class="form-group"><label>${translatedUI.yourPhoto}</label><img src="${opPhoto}" class="thumb-img" onclick="openModal('${safeSrc}')"></div>`;
}
if (item.comment) {
const tc = await translateText(item.comment, currentLangCode);
itemFormHtml += `<div class="form-group"><label>${translatedUI.yourComment}</label><div class="task-desc" style="border-left-color: var(--success);">${tc}</div></div>`;
}
} else {
itemFormHtml = `
<div class="form-group"><label>${translatedUI.uploadPhoto}</label><input type="file" id="report_photo_${key}_${i}" accept="image/*" capture="environment" required></div>
<div class="form-group"><label>${translatedUI.commentNote}</label><textarea id="report_comment_${key}_${i}" rows="2" required placeholder="Describe your progress..."></textarea></div>
`;
}
itemsHtml += `
<div class="item-box">
<strong>${translatedUI.item} ${i + 1}:</strong> ${translatedItem} <small style="color:var(--text-muted);">(${item.status || translatedUI.assigned})</small>
${dlmPhotoHtml}
${itemFormHtml}
</div>
`;
}
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
<div class="task-title">
<span>${translatedUI.reportTitle} ${rep.title || translatedUI.untitled} (${rep.status || translatedUI.assigned})</span>
<span class="task-ref">Ref: ${rep.refNumber || key.substring(0,8)}</span>
</div>
<div class="task-desc">
<strong>${translatedUI.location}</strong> ${rep.site || 'N/A'}<br>
<strong>${translatedUI.supervisor}</strong> ${rep.dlm || 'N/A'}
</div>
${bannerHTML}
${returnNoteHTML}
<form onsubmit="submitReport(event, '${key}', ${itemsArray.length})" novalidate>
${itemsHtml}
${!isReportLocked ? `<button type="submit">${translatedUI.submitReport}</button>` : ''}
</form>
`;
container.appendChild(card);
}
// ---------- Image Modal ----------
window.openModal = (src) => {
document.getElementById('modalImg').src = src;
document.getElementById('imgModal').style.display = 'flex';
};
// ---------- Submit Task (MODIFIED: now uses compression) ----------
window.submitTask = async (e, key) => {
e.preventDefault();
try {
const comment = document.getElementById(`comment_${key}`).value.trim();
const fileInput = document.getElementById(`photo_${key}`);
if (!comment || fileInput.files.length === 0) {
return alert(translatedUI.bothRequired);
}
// ====== MODIFIED: Use compression instead of direct FileReader ======
const photoData = await compressImage(fileInput.files[0]);
// ====== END MODIFICATION ======
const now = new Date().toISOString();
const snapshot = await get(ref(db, `tasks/${key}`));
const existing = snapshot.val() || {};
const history = existing.history || [];
history.push({ action: 'Submitted by team member', timestamp: now, comment });
// Create submission record
const submission = {
photo: photoData,
comment: comment,
timestamp: now
};

// Get existing submissions or create new array
const existingSubmissions = existing.submissions || [];
existingSubmissions.push(submission);

await update(ref(db, `tasks/${key}`), {
status: 'Submitted',
comment: comment,
operativePhoto: photoData,
photo: photoData,
submittedAt: now,
submissions: existingSubmissions,
history: history
});

alert(translatedUI.submitSuccess);
window.renderAllWork();
} catch (error) {
console.error("Error in submitTask:", error);
alert(translatedUI.submitError + error.message);
}
};
// ---------- Submit Report (MODIFIED: now uses compression) ----------
window.submitReport = async (e, key, itemCount) => {
e.preventDefault();
try {
const snapshot = await get(ref(db, `reports/${key}`));
const rep = snapshot.val();
if (!rep) return alert('Report not found in database.');
let rawItems = rep.items;
let itemsArray = rawItems ? (Array.isArray(rawItems) ? [...rawItems] : Object.values(rawItems)) : [];
const now = new Date().toISOString();
let anyChanges = false;
const totalItems = Number(itemCount);
for (let i = 0; i < totalItems; i++) {
const commentEl = document.getElementById(`report_comment_${key}_${i}`);
const fileEl = document.getElementById(`report_photo_${key}_${i}`);
if (!commentEl || !fileEl) continue;
const comment = commentEl.value.trim();
if (!comment || fileEl.files.length === 0) {
alert(`${translatedUI.item} ${i+1}: Both photo and comment are required.`);
return;
}
// ====== MODIFIED: Use compression instead of direct FileReader ======
const photoData = await compressImage(fileEl.files[0]);
// ====== END MODIFICATION ======
if (itemsArray[i]) {
const itemHistory = itemsArray[i].history || [];
itemHistory.push({ action: 'Submitted by team member', timestamp: now, comment });

// Create submission record
const submission = {
photo: photoData,
comment: comment,
timestamp: now
};

// Get existing submissions or create new array
const existingSubmissions = itemsArray[i].submissions || [];
existingSubmissions.push(submission);

itemsArray[i].comment = comment;
itemsArray[i].status = 'Submitted';
itemsArray[i].submittedPhoto = photoData;
itemsArray[i].operativePhoto = photoData;
itemsArray[i].submittedAt = now;
itemsArray[i].submissions = existingSubmissions;
itemsArray[i].history = itemHistory;
anyChanges = true;
}

}
if (!anyChanges) {
return alert(translatedUI.noItemsSubmitted);
}
const reportHistory = rep.history || [];
reportHistory.push({ action: 'Report submitted by team member', timestamp: now });
await update(ref(db, `reports/${key}`), {
status: 'Submitted',
items: itemsArray,
submittedAt: now,
history: reportHistory
});
alert(translatedUI.reportSubmitSuccess);
window.renderAllWork();
} catch (error) {
console.error("Error in submitReport:", error);
alert(translatedUI.reportSubmitError + error.message);
}
};
// ---------- ESC closes modal ----------
document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') {
document.getElementById('imgModal').style.display = 'none';
}
});
// ---------- Initial UI apply ----------
applyUIText();
</script>
