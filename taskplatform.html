<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - Operative Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app"></div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, set, onValue, query, orderByChild, equalTo, get } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentAuthUser = null;
        let currentTaskId = null;
        const appDiv = document.getElementById('app');

        function showLogin() {
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-6">Operative Portal</h1>
                        <form id="loginForm" class="space-y-4">
                            <input type="email" id="loginEmail" placeholder="Email" required class="w-full p-3 border rounded-lg">
                            <input type="password" id="loginPassword" placeholder="Password" required class="w-full p-3 border rounded-lg">
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Sign In</button>
                        </form>
                        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const errorMsg = document.getElementById('errorMsg');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        function showTaskInterface() {
            appDiv.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
                    <div class="max-w-lg mx-auto flex justify-between items-center">
                        <h1 class="text-lg font-bold">LinguaSiteFranca</h1>
                        <button id="logoutBtn" class="text-sm text-red-600">Sign Out</button>
                    </div>
                </nav>
                <div class="max-w-lg mx-auto px-6 py-8 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500">
                        <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">Your Task</h2>
                        <p id="taskDescription" class="text-lg font-semibold text-gray-800">Loading task...</p>
                        <div class="mt-2">
                            <span id="taskStatus" class="inline-block px-3 py-1 rounded-full text-xs bg-gray-100 text-gray-600">Checking...</span>
                        </div>
                    </div>

                    <div id="feedbackCard" class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-indigo-500 hidden">
                        <h2 class="text-xs font-bold text-indigo-500 uppercase mb-2">Manager Feedback</h2>
                        <p id="feedbackText" class="text-gray-700"></p>
                    </div>

                    <form id="submitTaskForm" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                        <h2 class="text-lg font-bold">Submit Task</h2>
                        <div>
                            <label class="block text-sm font-medium mb-1">Photos (1-3)</label>
                            <input type="file" id="photoInput" accept="image/*" multiple class="w-full p-3 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Comments</label>
                            <textarea id="operativeComment" rows="3" class="w-full p-3 border rounded-lg"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg">Submit Task</button>
                    </form>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
            document.getElementById('submitTaskForm').addEventListener('submit', handleSubmitTask);
            loadTask();
        }

        async function handleSubmitTask(e) {
            e.preventDefault();
            if (!currentTaskId) {
                alert('No active task');
                return;
            }

            const photoInput = document.getElementById('photoInput');
            const comment = document.getElementById('operativeComment').value;

            try {
                const photos = [];
                for (let file of photoInput.files) {
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                    photos.push(base64);
                }

                const taskRef = ref(db, `tasks/${currentTaskId}`);
                const snap = await get(taskRef);
                const data = snap.val();

                await set(taskRef, {
                    ...data,
                    status: 'submitted',
                    operative_comment_native: comment,
                    photos,
                    submittedAt: new Date().toISOString()
                });

                alert('✅ Task submitted!');
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        function loadTask() {
            if (!currentAuthUser) return;
            const q = query(ref(db, 'tasks'), orderByChild('operativeId'), equalTo(currentAuthUser.uid));
            onValue(q, (snapshot) => {
                let found = false;
                snapshot.forEach(child => {
                    const task = child.val();
                    currentTaskId = child.key;
                    found = true;

                    document.getElementById('taskDescription').textContent = task.description_en || 'No description';
                    const statusEl = document.getElementById('taskStatus');
                    const feedbackCard = document.getElementById('feedbackCard');
                    const feedbackText = document.getElementById('feedbackText');

                    statusEl.textContent = task.status;
                    if (task.status === 'rejected' && task.dlm_feedback_en) {
                        feedbackText.textContent = task.dlm_feedback_en;
                        feedbackCard.classList.remove('hidden');
                    } else {
                        feedbackCard.classList.add('hidden');
                    }
                });

                if (!found) {
                    document.getElementById('taskDescription').textContent = 'No active task assigned.';
                    document.getElementById('taskStatus').textContent = 'Idle';
                }
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('🟢 Operative Auth: User signed in:', user.uid);
                try {
                    const snap = await get(ref(db, `users/${user.uid}`));
                    if (snap.exists() && snap.val().role === 'operative') {
                        currentAuthUser = user;
                        showTaskInterface();
                    } else {
                        console.warn('⚠️ Access denied: Not Operative role.');
                        alert('Access denied: Operative account required');
                        signOut(auth);
                    }
                } catch (err) {
                    console.error('❌ DB error:', err);
                }
            } else {
                console.log('ℹ️ Operative Auth: Signed out.');
                showLogin();
            }
        });
    </script>
</body>
</html>
