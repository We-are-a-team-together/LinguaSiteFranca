<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">
    
    <header class="p-4 shadow-md flex justify-between items-center transition-colors duration-300" id="main-header">
        <h1 class="text-xl font-bold" id="brand-title"></h1>
        
        <!-- Extended Language Menu -->
        <select id="lang-select" class="bg-gray-800 text-white p-2 rounded border border-gray-700 focus:outline-none text-sm">
            <option value="en">English</option>
            <option value="ro">Română (Romanian)</option>
            <option value="es">Español (Spanish)</option>
            <option value="pl">Polski (Polish)</option>
            <option value="fr">Français (French)</option>
            <option value="de">Deutsch (German)</option>
            <option value="it">Italiano (Italian)</option>
            <option value="pt">Português (Portuguese)</option>
            <option value="uk">Українська (Ukrainian)</option>
            <option value="bg">Български (Bulgarian)</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="ar">العربية (Arabic)</option>
            <option value="zh">中文 (Chinese)</option>
        </select>
    </header>

    <!-- Login Section -->
    <div id="login-section" class="flex flex-col items-center justify-center flex-grow p-4">
        <div class="bg-gray-800 p-8 rounded-lg w-full max-w-md text-center shadow-lg">
            <h2 class="text-xl font-bold mb-4">Operative Access</h2>
            <input type="text" id="login-name" placeholder="Enter Your Full Name" class="w-full p-3 mb-4 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="btn-login" class="w-full bg-blue-600 p-3 rounded font-medium hover:bg-blue-500 transition">View Tasks</button>
        </div>
    </div>

    <!-- Task List Section -->
    <main id="tasks-section" class="hidden flex-grow p-6">
        <div id="task-container" class="flex flex-col gap-6 max-w-2xl mx-auto"></div>
    </main>

    <footer class="p-4 text-center text-sm text-gray-400 transition-colors duration-300" id="main-footer"></footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentOpKey = null;
        let activeTasksCache = [];

        const sanitizeKey = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, "_");

        onValue(ref(db, 'branding'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('brand-title').innerText = data.title || '';
                document.getElementById('main-header').style.backgroundColor = data.headerColor || '#1f2937';
                document.getElementById('main-footer').innerText = data.footer || '';
            }
        });

        // On-the-Fly Dynamic Translation
        async function translateText(text, targetLang) {
            if (targetLang === 'en' || !text) return text;
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
                const data = await res.json();
                return data.responseData.translatedText || text;
            } catch (err) {
                return text;
            }
        }

        document.getElementById('btn-login').addEventListener('click', async () => {
            const name = document.getElementById('login-name').value.trim();
            if(!name) return;

            currentOpKey = sanitizeKey(name);
            const snapshot = await get(ref(db, 'operatives/' + currentOpKey));

            if (snapshot.exists()) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('tasks-section').classList.remove('hidden');
                listenForTasks();
            } else {
                alert("Operative name not found. Please ask your DLM to register you.");
            }
        });

        document.getElementById('lang-select').addEventListener('change', () => {
            renderTasks();
        });

        function listenForTasks() {
            onValue(ref(db, `tasks/${currentOpKey}`), (snapshot) => {
                activeTasksCache = [];
                snapshot.forEach((child) => {
                    const task = child.val();
                    if (task.status === 'pending' || task.status === 'rejected') {
                        activeTasksCache.push({ id: child.key, ...task });
                    }
                });

                // Chronological Sorting (Oldest tasks first)
                activeTasksCache.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                renderTasks();
            });
        }

        async function renderTasks() {
            const targetLang = document.getElementById('lang-select').value;
            const container = document.getElementById('task-container');
            container.innerHTML = '<p class="text-center text-gray-400">Loading & Translating Tasks...</p>';

            if (activeTasksCache.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400">No active tasks currently assigned.</p>';
                return;
            }

            container.innerHTML = '';

            for (const task of activeTasksCache) {
                const translatedDesc = await translateText(task.description, targetLang);

                const card = document.createElement('div');
                card.className = "bg-gray-800 p-6 rounded-lg shadow-md border border-gray-700 flex flex-col gap-3";

                card.innerHTML = `
                    <div class="text-xs text-gray-400">${new Date(task.timestamp).toLocaleString()}</div>
                    <p class="text-lg leading-relaxed text-gray-100">${translatedDesc}</p>
                    <input type="file" id="file-${task.id}" accept="image/*" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-gray-700 file:text-white">
                    <textarea id="comment-${task.id}" placeholder="Comments..." class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none h-16 text-sm"></textarea>
                    <button id="submit-btn-${task.id}" class="bg-green-600 p-3 rounded font-medium hover:bg-green-500 w-full transition">Submit Completion</button>
                `;
                container.appendChild(card);

                document.getElementById(`submit-btn-${task.id}`).addEventListener('click', () => {
                    submitTask(task.id);
                });
            }
        }

        async function submitTask(taskId) {
            const fileInput = document.getElementById(`file-${taskId}`);
            const comment = document.getElementById(`comment-${taskId}`).value;
            const lang = document.getElementById('lang-select').value;
            
            let photoData = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                photoData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            update(ref(db, `tasks/${currentOpKey}/${taskId}`), {
                status: 'submitted',
                photo: photoData,
                originalComment: comment,
                sourceLang: lang
            });
        }
    </script>
</body>
</html>
