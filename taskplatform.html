<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Member Workspace</title>
<style>
:root { --bg: #0f172a; --card-bg: #1e293b; --accent: #3b82f6; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
html, body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
.login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; }
.login-card { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; text-align: center; }
.container { width: 100%; max-width: 1400px; margin: 0 auto; display: none; flex-direction: column; }
.form-group { margin-bottom: 14px; }
input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; }
button { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-login { background: var(--accent); margin-top: 10px; }
.card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 18px; }
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h2 id="loginTitle">Team Member Login</h2>
    <p>Enter your credentials provided by your Site Supervisor</p>
    <form id="opLoginForm">
      <div class="form-group"><input type="text" id="opLoginName" placeholder="Your Name" required></div>
      <div class="form-group"><input type="password" id="opLoginPassword" placeholder="Password" required></div>
      <button type="submit" class="btn-login">Access Workspace</button>
    </form>
    <p id="loginError" style="color: var(--danger); margin-top: 12px; display: none;"></p>
  </div>
</div>

<div class="container" id="mainContainer">
  <header style="border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px;">
    <h2>Workspace — <span id="opDisplayName">Team Member</span></h2>
  </header>
  <div id="tasksContainer"><div style="text-align:center;">Loading your assignments...</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
  authDomain: "lingua-site-franca.firebaseapp.com",
  databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lingua-site-franca"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = "";

document.getElementById('opLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('opLoginName').value.trim();
  const pwd = document.getElementById('opLoginPassword').value;
  
  const snap = await new Promise(resolve => onValue(ref(db, 'operatives'), resolve, { onlyOnce: true }));
  const ops = snap.val() || {};
  let valid = false;
  
  for (const k of Object.keys(ops)) {
    if (ops[k].name.toLowerCase() === name.toLowerCase() && ops[k].password === pwd) { valid = true; break; }
  }
  
  if (valid) {
    currentUser = name;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContainer').style.display = 'flex';
    document.getElementById('opDisplayName').innerText = name;
    loadTasks();
  } else {
    document.getElementById('loginError').innerText = "Invalid credentials";
    document.getElementById('loginError').style.display = "block";
  }
});

function loadTasks() {
  onValue(ref(db, 'tasks'), (snapshot) => {
    const data = snapshot.val() || {};
    let html = '';
    Object.keys(data).forEach(key => {
      const task = data[key];
      if (task.operative === currentUser) {
        html += `<div class="card">
          <h3>Task: ${task.refNumber || key.substring(0,8)}</h3>
          <p><strong>Status:</strong> ${task.status}</p>
          <p>${task.details}</p>
          ${task.status !== 'Accepted' ? `<button onclick="markComplete('${key}')" style="margin-top:10px;">Mark Complete</button>` : ''}
        </div>`;
      }
    });
    document.getElementById('tasksContainer').innerHTML = html || "<div style='text-align:center;'>No tasks assigned.</div>";
  });
}

window.markComplete = async (key) => {
  await update(ref(db, `tasks/${key}`), { status: 'Submitted', submittedAt: new Date().toISOString() });
  alert('Task submitted for review!');
};
</script>
</body>
</html>
