<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operative Task Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { width: 95%; max-width: 1400px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .lang-select { padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
    .task-title { font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    .task-desc { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; color: #fff; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    textarea, input[type="file"] { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; }

    button { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
    button:hover { opacity: 0.9; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 50px 0; font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>Operative Task Workspace</h2>
    <select id="langSelect" class="lang-select">
      <option value="ro">Română (Romanian)</option>
      <option value="pl">Polski (Polish)</option>
      <option value="bg">Български (Bulgarian)</option>
      <option value="uk">Українська (Ukrainian)</option>
      <option value="es">Español (Spanish)</option>
      <option value="pt">Português (Portuguese)</option>
      <option value="it">Italiano (Italian)</option>
      <option value="fr">Français (French)</option>
      <option value="lt">Lietuvių (Lithuanian)</option>
      <option value="lv">Latviešu (Latvian)</option>
      <option value="hu">Magyar (Hungarian)</option>
      <option value="sk">Slovenčina (Slovak)</option>
    </select>
  </header>

  <div id="tasksContainer">
    <div class="empty-state">No active tasks assigned.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://linguasitefranca-default-rtdb.europe-west1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const urlParams = new URLSearchParams(window.location.search);
  const currentOp = urlParams.get('op') || 'TEST 1';

  async function translateText(text, targetLang) {
    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
      const data = await res.json();
      return data[0][0][0];
    } catch (e) {
      return text;
    }
  }

  function renderTasks() {
    const lang = document.getElementById('langSelect').value;
    onValue(ref(db, 'tasks'), async (snapshot) => {
      const data = snapshot.val() || {};
      const container = document.getElementById('tasksContainer');
      container.innerHTML = '';

      let hasTasks = false;

      for (const key of Object.keys(data)) {
        const task = data[key];
        if (task.operative.toLowerCase() === currentOp.toLowerCase() && (task.status === 'Assigned' || task.status === 'Returned')) {
          hasTasks = true;
          const translatedDetails = await translateText(task.details, lang);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="task-title">Task #${key.slice(-4)} (${task.status})</div>
            <div class="task-desc">${translatedDetails}</div>
            ${task.returnNote ? `<div style="color: var(--danger); margin-bottom: 15px;"><strong>Return Note:</strong> ${task.returnNote}</div>` : ''}
            <form onsubmit="submitTask(event, '${key}')">
              <div class="form-group">
                <label>Photo Evidence</label>
                <input type="file" id="photo_${key}" accept="image/*" capture="environment">
              </div>
              <div class="form-group">
                <label>Comments / Notes</label>
                <textarea id="comment_${key}" rows="3"></textarea>
              </div>
              <button type="submit">Submit Task</button>
            </form>
          `;
          container.appendChild(card);
        }
      }

      if (!hasTasks) {
        container.innerHTML = `<div class="empty-state">No active tasks assigned.</div>`;
      }
    });
  }

  document.getElementById('langSelect').addEventListener('change', renderTasks);
  renderTasks();

  window.submitTask = async (e, key) => {
    e.preventDefault();
    const comment = document.getElementById(`comment_${key}`).value.trim();
    const fileInput = document.getElementById(`photo_${key}`);

    let photoData = null;
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      photoData = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    update(ref(db, `tasks/${key}`), {
      status: 'Submitted',
      comment: comment,
      photo: photoData,
      submittedAt: new Date().toISOString()
    }).then(() => {
      alert('Task submitted successfully!');
    });
  };
</script>
</body>
</html>
