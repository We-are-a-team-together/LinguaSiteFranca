<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">
    
    <header class="p-4 shadow-md flex justify-between items-center transition-colors duration-300" id="main-header">
        <h1 class="text-xl font-bold" id="brand-title"></h1>
        <select id="lang-select" class="bg-gray-800 text-white p-1 rounded focus:outline-none">
            <option value="en">English</option>
            <option value="ro">Română</option>
            <option value="es">Español</option>
            <option value="pl">Polski</option>
        </select>
    </header>

    <!-- Login Section -->
    <div id="login-section" class="flex flex-col items-center justify-center flex-grow">
        <div class="bg-gray-800 p-8 rounded-lg w-96 text-center">
            <input type="email" id="login-email" class="w-full p-2 mb-4 rounded bg-gray-700 text-white focus:outline-none" value="">
            <button id="btn-login" class="w-full bg-blue-600 p-2 rounded hover:bg-blue-500"></button>
        </div>
    </div>

    <!-- Task List Section -->
    <main id="tasks-section" class="hidden flex-grow p-6">
        <div id="task-container" class="flex flex-col gap-4 max-w-2xl mx-auto"></div>
    </main>

    <footer class="p-4 text-center text-sm text-gray-400 transition-colors duration-300" id="main-footer"></footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUserEmail = null;

        // Branding Sync
        onValue(ref(db, 'branding'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('brand-title').innerText = data.title || '';
                document.getElementById('main-header').style.backgroundColor = data.headerColor || '#1f2937';
                document.getElementById('main-footer').innerText = data.footer || '';
            }
        });

        // Basic Client-Side Dictionary for UI elements
        const dict = {
            en: { loginBtn: "Access Tasks", submit: "Complete Task" },
            ro: { loginBtn: "Accesați Sarcinile", submit: "Finalizați Sarcina" },
            es: { loginBtn: "Acceder a Tareas", submit: "Completar Tarea" },
            pl: { loginBtn: "Dostęp do Zadań", submit: "Zakończ Zadanie" }
        };

        function updateUI() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('btn-login').innerText = dict[lang].loginBtn;
        }
        
        document.getElementById('lang-select').addEventListener('change', updateUI);
        updateUI();

        // Login Logic
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.replace(/\./g, ',');
            const snapshot = await get(ref(db, 'operatives/' + email));
            if (snapshot.exists()) {
                currentUserEmail = email;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('tasks-section').classList.remove('hidden');
                loadTasks();
            }
        });

        function loadTasks() {
            onValue(ref(db, `tasks/${currentUserEmail}`), (snapshot) => {
                const container = document.getElementById('task-container');
                container.innerHTML = '';
                snapshot.forEach((child) => {
                    const task = child.val();
                    if(task.status === 'pending' || task.status === 'reassigned') {
                        const card = document.createElement('div');
                        card.className = "bg-gray-800 p-4 rounded-lg";
                        
                        card.innerHTML = `
                            <p class="mb-4">${task.description}</p>
                            <input type="file" id="file-${child.key}" accept="image/*" class="mb-2 block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-gray-700 file:text-white">
                            <textarea id="comment-${child.key}" class="w-full p-2 mb-2 rounded bg-gray-700 text-white focus:outline-none h-16" value=""></textarea>
                            <button id="submit-btn-${child.key}" class="bg-green-600 p-2 rounded hover:bg-green-500 w-full">${dict[document.getElementById('lang-select').value].submit}</button>
                        `;
                        container.appendChild(card);

                        // Attach event listener directly to the dynamically created button
                        document.getElementById(`submit-btn-${child.key}`).addEventListener('click', () => {
                            submitTask(child.key);
                        });
                    }
                });
            });
        }

        async function submitTask(taskId) {
            const fileInput = document.getElementById(`file-${taskId}`);
            const comment = document.getElementById(`comment-${taskId}`).value;
            const lang = document.getElementById('lang-select').value;
            
            let photoData = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                photoData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            update(ref(db, `tasks/${currentUserEmail}/${taskId}`), {
                status: 'submitted',
                photo: photoData,
                originalComment: comment,
                sourceLang: lang
            });
        }
    </script>
</body>
</html>
