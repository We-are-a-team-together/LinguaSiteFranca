<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - Head Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-700 rounded-lg flex items-center justify-center text-white font-bold">L</div>
            <h1 class="text-xl font-bold text-gray-800">LinguaSiteFranca</h1>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Head Office</span>
        </div>
        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 font-medium text-sm">Sign Out</button>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Active Sites</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2" id="statSites">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Active DLMs</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2" id="statDlms">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Pending Tasks</h3>
                <p class="text-3xl font-bold text-yellow-600 mt-2" id="statTasks">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Deploy New Site</h2>
                    <form id="createSiteForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Site / Project Name</label>
                            <input type="text" id="siteName" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="e.g., London Logistics Hub">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Industry</label>
                            <select id="siteIndustry" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="Construction">Construction</option>
                                <option value="Logistics">Logistics & Warehousing</option>
                                <option value="Maintenance">Facility Maintenance</option>
                                <option value="Healthcare">Healthcare & Inspections</option>
                                <option value="Retail">Retail & Audits</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Assigned DLM Email</label>
                            <input type="email" id="dlmEmail" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="manager@company.com">
                            <p class="text-xs text-gray-500 mt-1">*DLM must be created in Firebase Auth first.</p>
                        </div>
                        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded-lg transition">
                            Launch Site
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Active Ecosystem</h2>
                <div id="sitesList" class="space-y-4">
                    <div class="bg-white p-4 rounded-xl border border-dashed border-gray-300 text-center text-gray-500">Loading sites...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDa9uoat_ztP_4GpplxF1jVzmAzxQDdUw0",
            authDomain: "linguasitefranca.firebaseapp.com",
            projectId: "linguasitefranca",
            storageBucket: "linguasitefranca.firebasestorage.app",
            messagingSenderId: "206112054381",
            appId: "1:206112054381:web:3181e8099d859a23783364"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'headquarter.html';
                return;
            }
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().role !== 'head_office') {
                alert("Access Denied: Head Office only.");
                auth.signOut();
                window.location.href = 'headquarter.html';
            } else {
                loadDashboardData();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

        async function loadDashboardData() {
            const sitesList = document.getElementById('sitesList');
            sitesList.innerHTML = ''; 

            const sitesSnapshot = await db.collection('sites').get();
            document.getElementById('statSites').innerText = sitesSnapshot.size;

            if (sitesSnapshot.empty) {
                sitesList.innerHTML = '<div class="bg-white p-8 rounded-xl border border-dashed border-gray-300 text-center text-gray-500">No active sites yet. Deploy your first one on the left!</div>';
                return;
            }

            sitesSnapshot.forEach(doc => {
                const site = doc.data();
                const html = `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">${site.name}</h3>
                            <p class="text-sm text-gray-500">${site.industry} • DLM: ${site.dlm_email}</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Active</span>
                            <p class="text-xs text-gray-400 mt-1">ID: ${doc.id}</p>
                        </div>
                    </div>
                `;
                sitesList.innerHTML += html;
            });
        }

        document.getElementById('createSiteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('siteName').value;
            const industry = document.getElementById('siteIndustry').value;
            const dlmEmail = document.getElementById('dlmEmail').value;

            try {
                await db.collection('sites').add({
                    name: name,
                    industry: industry,
                    dlm_email: dlmEmail,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'active',
                    branding: { primary_color: '#1d4ed8', logo_url: '' }
                });
                alert(`Site "${name}" deployed successfully!`);
                document.getElementById('createSiteForm').reset();
                loadDashboardData();
            } catch (error) {
                console.error(error);
                alert("Error deploying site: " + error.message);
            }
        });
    </script>
</body>
</html>
