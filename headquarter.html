<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800">LinguaSiteFranca</h1>
            <p class="text-gray-500 text-sm mt-2">Secure Field Communication Portal</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200">
                Sign In
            </button>
        </form>

        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDa9uoat_ztP_4GpplxF1jVzmAzxQDdUw0",
            authDomain: "linguasitefranca.firebaseapp.com",
            projectId: "linguasitefranca",
            storageBucket: "linguasitefranca.firebasestorage.app",
            messagingSenderId: "206112054381",
            appId: "1:206112054381:web:3181e8099d859a23783364"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerText = "Signing in...";
            errorMsg.classList.add('hidden');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;
                const userDoc = await db.collection('users').doc(uid).get();
                
                if (!userDoc.exists) {
                    throw new Error("User profile not found. Contact Head Office.");
                }

                const role = userDoc.data().role;

                // UPDATED REDIRECTS TO MATCH YOUR NEW FILE NAMES
                if (role === 'head_office') {
                    window.location.href = 'headoffice.html'; 
                } else if (role === 'dlm') {
                    window.location.href = 'dlm.html';    
                } else if (role === 'operative') {
                    window.location.href = 'operative.html'; 
                } else {
                    throw new Error("Invalid user role.");
                }

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Login failed: " + error.message;
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
