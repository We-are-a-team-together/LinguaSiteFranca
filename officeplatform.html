        // Check if head_office user exists (with error handling)
        async function checkIfHeadOfficeExists() {
            try {
                const usersRef = ref(db, 'users');
                const q = query(usersRef, orderByChild('role'), equalTo('head_office'));
                const snapshot = await get(q);
                return snapshot.exists();
            } catch (error) {
                console.error('Permission error checking head office:', error);
                // If permission denied, assume no head office exists
                return false;
            }
        }
