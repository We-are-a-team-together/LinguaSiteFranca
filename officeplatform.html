<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSiteFranca - Head Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getDatabase, ref, set, onValue, push, get } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
            authDomain: "lingua-site-franca.firebaseapp.com",
            databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lingua-site-franca",
            storageBucket: "lingua-site-franca.firebasestorage.app",
            messagingSenderId: "737514168886",
            appId: "1:737514168886:web:08f3abd5816505d3a72e97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const appDiv = document.getElementById('app');

        function showLogin() {
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-6">Head Office Portal</h1>
                        <form id="loginForm" class="space-y-4">
                            <input type="email" id="loginEmail" placeholder="Email" required class="w-full p-3 border rounded-lg">
                            <input type="password" id="loginPassword" placeholder="Password" required class="w-full p-3 border rounded-lg">
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Sign In</button>
                        </form>
                        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const errorMsg = document.getElementById('errorMsg');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        function showOfficeDashboard() {
            appDiv.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
                    <div class="max-w-4xl mx-auto flex justify-between items-center">
                        <h1 class="text-lg font-bold">LinguaSiteFranca - Head Office</h1>
                        <button id="logoutBtn" class="text-sm text-red-600 font-medium">Sign Out</button>
                    </div>
                </nav>
                <div class="max-w-4xl mx-auto px-6 py-8 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h2 class="text-xl font-bold mb-4">Register User (DLM or Operative)</h2>
                        <form id="registerForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Email" required class="w-full p-3 border rounded-lg">
                            <input type="password" id="regPassword" placeholder="Password (min 6 chars)" required class="w-full p-3 border rounded-lg">
                            <input type="text" id="regName" placeholder="Full Name" required class="w-full p-3 border rounded-lg">
                            <select id="regRole" class="w-full p-3 border rounded-lg">
                                <option value="dlm">Direct Line Manager (DLM)</option>
                                <option value="operative">Operative</option>
                            </select>
                            <div id="dlmSelectContainer" class="hidden">
                                <label class="block text-sm font-medium mb-1">Assign to DLM</label>
                                <select id="regAssignedDlm" class="w-full p-3 border rounded-lg"></select>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg">Create User</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
            document.getElementById('regRole').addEventListener('change', (e) => {
                const container = document.getElementById('dlmSelectContainer');
                if (e.target.value === 'operative') {
                    container.classList.remove('hidden');
                    loadDlmsIntoSelect();
                } else {
                    container.classList.add('hidden');
                }
            });

            document.getElementById('registerForm').addEventListener('submit', handleRegisterUser);
        }

        async function loadDlmsIntoSelect() {
            const usersSnapshot = await get(ref(db, 'users'));
            const select = document.getElementById('regAssignedDlm');
            select.innerHTML = '';
            usersSnapshot.forEach(child => {
                const u = child.val();
                if (u.role === 'dlm') {
                    const opt = document.createElement('option');
                    opt.value = child.key;
                    opt.textContent = u.name || u.email;
                    select.appendChild(opt);
                }
            });
        }

        async function handleRegisterUser(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            const role = document.getElementById('regRole').value;
            const assignedDlm = role === 'operative' ? document.getElementById('regAssignedDlm').value : null;

            try {
                const secondaryAppName = "SecondaryApp_" + Date.now();
                const secondaryApp = initializeApp(firebaseConfig, secondaryAppName);
                const secondaryAuth = getAuth(secondaryApp);
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                
                await set(ref(db, `users/${cred.user.uid}`), {
                    name, email, role, assignedDlm: assignedDlm || '', nativeLanguage: 'en'
                });

                alert('✅ User registered successfully!');
                e.target.reset();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('🟢 Office Auth: User signed in:', user.uid);
                try {
                    const snap = await get(ref(db, `users/${user.uid}`));
                    if (snap.exists()) {
                        const userData = snap.val();
                        // Accepts head_office, admin, or missing role during initial bootstrap setup
                        const role = userData.role || '';
                        if (role === 'head_office' || role === 'admin' || !role) {
                            showOfficeDashboard();
                            return;
                        }
                    }
                    // If no user node exists yet (first time bootstrap setup), allow dashboard access
                    if (!snap.exists()) {
                        showOfficeDashboard();
                        return;
                    }

                    console.warn('⚠️ Access denied: Account lacks Head Office privileges.');
                    showLogin();
                } catch (err) {
                    console.error('❌ DB error during auth check:', err);
                }
            } else {
                console.log('ℹ️ Office Auth: Signed out.');
                showLogin();
            }
        });
    </script>
</body>
</html>
