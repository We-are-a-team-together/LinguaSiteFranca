<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Management Dashboard</title>
<style>
:root { --bg: #0f172a; --card-bg: #1e293b; --accent: #3b82f6; --accent-hover: #2563eb; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background-color: var(--bg); color: var(--text); padding: 20px; }
.container { width: 96%; max-width: 1800px; margin: 0 auto; display: flex; flex-direction: column; min-height: 95vh; }
header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
.header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-logo { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; display: none; }
h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
.btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
.btn-primary { background: var(--accent); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; }
.btn-warning { background: var(--warning); color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; margin-bottom: 25px; }
.card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
.card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
.form-group { margin-bottom: 15px; }
label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
input, select { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
th { background: rgba(0,0,0,0.2); color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
.badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.badge-valid { background: rgba(16, 185, 129, 0.2); color: var(--success); }
.badge-expired { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
.badge-assigned { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
.action-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <img id="headerLogo" class="header-logo" src="" alt="Logo">
      <h1><span class="brand-name">Office</span> — Management Dashboard</h1>
    </div>
  </header>

  <div class="filter-bar">
    <label for="siteFilter">Filter by Location:</label>
    <select id="siteFilter" onchange="applyFilter()"><option value="ALL">All Locations</option></select>
  </div>

  <div class="card">
    <div class="card-title">Master Tasks Management</div>
    <div style="overflow-x: auto;">
      <table>
        <thead><tr><th>Ref</th><th>Site</th><th>DLM</th><th>Operative</th><th>Task</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="masterTasksTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyjEciES-wjKFvbrOyHpgXExdmqKFboIs",
  authDomain: "lingua-site-franca.firebaseapp.com",
  databaseURL: "https://lingua-site-franca-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lingua-site-franca"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentFilter = 'ALL';
window.applyFilter = () => { currentFilter = document.getElementById('siteFilter').value; renderTasks(); };
function matchesFilter(siteName) { return currentFilter === 'ALL' || (siteName && siteName.toLowerCase() === currentFilter.toLowerCase()); }

const translationCache = {};
async function getTranslation(text) {
  if (!text) return 'None';
  if (translationCache[text]) return translationCache[text];
  try {
    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
    const data = await res.json();
    translationCache[text] = data[0][0][0];
    return translationCache[text];
  } catch (e) { return text; }
}

function renderTasks() {
  onValue(ref(db, 'tasks'), (snapshot) => {
    const data = snapshot.val() || {};
    let html = '';
    Object.keys(data).forEach(key => {
      const task = data[key];
      if (!matchesFilter(task.site)) return;
      let badgeClass = task.status === 'Accepted' || task.status === 'Approved' ? 'badge-valid' : task.status === 'Returned' ? 'badge-expired' : 'badge-assigned';
      html += `<tr><td><strong>${task.refNumber || key.substring(0,8)}</strong></td><td>${task.site || 'N/A'}</td><td>${task.dlm || 'N/A'}</td><td>${task.operative || 'N/A'}</td><td style="max-width:200px;">${task.details || ''}</td><td><span class="badge ${badgeClass}">${task.status || 'Assigned'}</span></td><td><div class="action-row"><button class="btn btn-danger" onclick="deleteTask('${key}')">Delete</button></div></td></tr>`;
    });
    document.getElementById('masterTasksTableBody').innerHTML = html;
  }, { onlyOnce: true });
}

window.deleteTask = (key) => { if (confirm('Delete this task?')) remove(ref(db, `tasks/${key}`)); renderTasks(); };

// Populate filters
onValue(ref(db, 'sites'), (snapshot) => {
  const data = snapshot.val() || {};
  const filterSelect = document.getElementById('siteFilter');
  let filterHtml = '<option value="ALL">All Locations</option>';
  Object.keys(data).forEach(k => filterHtml += `<option value="${data[k].name}">${data[k].name}</option>`);
  filterSelect.innerHTML = filterHtml;
  filterSelect.value = currentFilter;
  renderTasks();
});
</script>
</body>
</html>
